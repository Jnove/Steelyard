name: CI

on:
  push:
    branches: [main, feat/**]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: 后端 ruff + pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.0"

      - name: 同步依赖（含 dev 组）
        run: uv sync --all-extras

      - name: ruff check
        run: uv run ruff check .

      - name: pytest
        run: uv run pytest

      # T3 启用规则校验脚本时取消注释
      # - name: check_rules
      #   run: uv run python ../scripts/check_rules.py

  frontend:
    name: 前端 tsc + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        run: npm ci || npm install

      - name: 类型检查
        run: npx tsc --noEmit

      - name: 构建
        run: npm run build