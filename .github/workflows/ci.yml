name: CI

on:
  push:
    branches: [main, feat/**, codex/**]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: 后端 ruff + pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.12.19"

      - name: 同步依赖（含 dev 组）
        run: uv sync --all-extras --frozen

      - name: ruff check
        run: uv run ruff check .

      - name: scripts ruff check
        run: uv run ruff check --config pyproject.toml ../scripts

      - name: pytest
        run: uv run pytest

      # T9 启用：校验 rules/*.yaml + 字段对照表与 JSON Schema 一致
      - name: check_rules
        run: uv run python ../scripts/check_rules.py

      - name: gen_field_table --check
        run: uv run python ../scripts/gen_field_table.py --check

      - name: 后端 Schema 与提交产物一致
        run: |
          uv run python ../scripts/export_schema.py
          git diff --exit-code -- ../data/schema

  frontend:
    name: 前端 tsc + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 前端测试（T7 + T8 + 集成协议）
        run: npm test

      - name: 生成类型与提交产物一致
        run: |
          npm run gen:types
          git diff --exit-code -- src/api/generated

      - name: 类型检查
        run: npx tsc --noEmit

      - name: 构建
        run: npm run build
