# Dockerfile 将 __APP_BASE__ 替换为 / 或 /steelyard/；外层代理须保留前缀。
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # 外层 HTTPS 代理收到相对 Location，避免泄漏容器端口或降级到 HTTP。
    absolute_redirect off;

    location ~ ^__APP_BASE_NO_SLASH__$ {
        return 308 __APP_BASE__;
    }

    location __APP_BASE__api/ {
        proxy_pass http://__BACKEND_HOST__:8000/api/;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 缺失的脚本必须 404，不能用 SPA HTML 伪装成功。
    location __APP_BASE__assets/ {
        rewrite ^__APP_BASE__(.*)$ /$1 break;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location __APP_BASE__ {
        rewrite ^__APP_BASE__(.*)$ /$1 break;
        try_files $uri $uri/ __APP_BASE__index.html;
        add_header Cache-Control "no-cache";
    }

    location = /healthz {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
