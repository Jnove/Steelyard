# T9 指南示例 6：适中最好的评分指标
#
# 用途：南向比例太低不利于日照，太高则牺牲通风与户型多样性，0.55 附近最理想。
# points 先升后降：横轴先增（0.20 → 0.55），纵轴先升（0 → 100）；到达峰值后横轴
# 继续增（0.55 → 0.90），纵轴回落（100 → 0）。横轴始终严格递增，纵轴先升后降。
- id: Q-03
  name: 主要房间南向比例（适中最好）
  type: metric
  dimension: quality
  value: "south_room_ratio"
  scoring:
    kind: piecewise
    points:
      - [0.20, 0]
      - [0.55, 100]
      - [0.90, 0]
  weight_in_dimension: 1
  source: "TODO(专业组)：示例数值，正式条文号待补"
