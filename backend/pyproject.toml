[project]
name = "zhuheng-backend"
version = "0.1.0"
description = "筑衡 · 建筑方案智能比选智能体（后端）"
readme = "../README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "sqlmodel>=0.0.21",
    "openpyxl>=3.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
    "matplotlib>=3.8",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
# 项目初期先开最小集合，避免一上来被历史告警淹没
select = ["E", "F", "I", "B", "UP"]
ignore = [
    "E501",  # 行长度由 formatter 控制
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]  # pytest 的 assert 写法不需要改

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"