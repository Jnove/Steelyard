# 筑衡 · 一键启动开发环境
#
# 启动：
#   docker compose up --build
#   浏览器打开 http://localhost:8080
#
# 关闭：
#   docker compose down
#
# 数据卷说明：
#   - data/   SQLite 数据库与测试方案（开发期可直接看文件）
#   - rules/  土木 / 建筑同学维护的 YAML 规则

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: zhuheng-backend:dev
    container_name: zhuheng-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # 使用容器内绝对路径，指向下方持久化卷；覆盖值也需使用容器路径
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/data/zhuheng.db}
      LLM_PROVIDER: ${LLM_PROVIDER:-fake}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:5173}
    volumes:
      # 代码单独挂载以支持本地改代码即时生效（生产部署建议去掉）
      - ./backend/app:/app/backend/app
      # 持久化数据 / 规则
      - ./data:/app/data
      - ./rules:/app/rules

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: zhuheng-frontend:dev
    container_name: zhuheng-frontend
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - backend
    environment:
      # Nginx 反代目标是 docker 网络里的 backend 服务
      BACKEND_URL: http://backend:8000
