# 结构安全评分指标（metric，dimension: structure）与结构相关硬约束。规则 ID 用 S-XX。
#
# ⚠️ **土木（结构）类的规则全部集中在本文件，一律用 S-XX**；建筑 / 规划类的硬约束
#    在 rules/compliance.yaml（C-XX）。两边分开是刻意的：由不同的人维护，
#    共用 C- 系列会撞号——S-12 楼板厚度、S-13 结构设计工作年限、S-14 混凝土强度等级
#    原先就写在 compliance.yaml 里（C-13/C-14/C-18），2026-10 统一搬到这里。
#
# 已由专业组核定（2026-10）。历次补充：
# 1. S-01 不再「数个数」：大悬挑和复杂地质的风险显然不等价，改为按风险类型加权；
# 2. 新增 S-03 结构体系适用性（对应「结构选型」）与 S-04 建筑总高（对应「抗震/超限」）；
# 3. S-05/S-06 按抗震设防烈度取结构最大适用高度（JGJ 3—2010 表3.3.1-1）；
#    S-07 高宽比提示（warning，JGJ 3—2010 表3.3.2）；
# 4. S-10/S-11 超限高层不规则项提示（建质〔2015〕67号 附件1 表2/表4）；
# 5. S-12~S-14 楼板厚度、结构设计工作年限、混凝土强度等级（由 C 系列迁入）；
# 6. 原先的 S-08/S-09「MiC 最大适用高度」与 MiC 专项文件已随「地区册」机制迁出：
#    改为 rules/zj_mic.yaml（编号 ZJ-S-03 / ZJ-S-04，pack: ZJ）。那是浙江省导则的要求，
#    **默认关闭**，只有勾选了浙江省册的项目才生效（见 docs/design-regional-packs.md）。
#
# ⚠️ **依据只用国家层面标准**：GB / GB/T、JGJ 等行业标准、住建部部委文件。
#    **不采用地方标准与地方导则**（DB33、浙江省各类导则等）——本项目当前在杭州，
#    但将来做个性化项目时地方条例未必适用，规则里一旦掺进地方限值就没法迁移。
#    据此，原先基于浙江省《混凝土模块化建筑技术导则》的 MiC 最大适用高度
#    （S-08/S-09）与 MiC 专项文件 structure_mic.yaml（MiC 混凝土等级、MiC 高宽比）
#    已移除；被移除的数值与出处记在 docs/open-items.md §1.5，需要时可恢复。
#
# 仍未覆盖的内容见 docs/open-items.md（例如：抗震等级、附件1 表3 的显著不规则项、
# 钢结构最大适用高度——JGJ 99 尚未核对，故 S-05/S-06 目前只覆盖混凝土体系）。

- id: S-01
  name: 结构风险特征加权指数（越少越好）
  type: metric
  dimension: structure
  # 不再用 len() 数个数，改为按风险类型对结构安全与专项论证的影响加权。
  # 引擎支持比较与算术，布尔值可直接参与计算，故这种写法是合法的。
  value: "3 * (risk_features contains '大悬挑') + 3 * (risk_features contains '深基坑') + 3 * (risk_features contains '超限构件') + 2 * (risk_features contains '高大空间') + 2 * (risk_features contains '高支模') + 1 * (risk_features contains '超长结构') + 1 * (risk_features contains '不规则建筑') + 1 * (risk_features contains '复杂地质')"
  scoring:
    kind: piecewise
    # 满分为 16 分（3+3+3+2+2+1+1+1）。
    points:
      - [0, 100]
      - [5, 75]
      - [10, 45]
      - [16, 0]
  weight_in_dimension: 2
  source: "经验规则（结构组）：按风险类型对结构安全与专项论证的影响加权——大悬挑、深基坑、超限构件各 3 分（均直接触发专项论证或专门研究），高大空间、高支模各 2 分，超长结构、不规则建筑、复杂地质各 1 分，满分 16 分。权重与分段点为组内取值，非规范条文"

- id: S-02
  name: 钢结构方案须申报人工复核事项（条件硬约束）
  type: hard
  # when 为假（不是钢结构）时，这条规则记为「不适用」，不影响该方案。
  when: "structure_type == '钢结构'"
  # 原写法借用「超限构件」这个预设项，但 GB 55006—2021 全文并无「超限构件」
  # 这一表述，语义对不上。改为要求钢结构方案**显式申报**复核事项：
  # 钢结构规范对新型结构/构件/连接节点与体形复杂的大跨结构都要求专项验证，
  # 申报不出来就提示人工复核。严重程度保持 warning（提示，不踢出排名）。
  check: "len(risk_features) >= 1"
  message: "钢结构方案请在 risk_features 中列出需要人工复核的风险特征（如大悬挑、高大空间、复杂地质）"
  severity: warning
  source: "GB 55006—2021 第4.6.4条：需调整构造措施时，或对于新型结构、构件、连接节点，应通过计算分析和试验验证保证安全要求；第5.3节：体形复杂的大跨度钢结构应采用整体模型计算，并作非线性整体稳定分析与时程分析。本条据此要求钢结构方案显式申报复核事项"

- id: S-03
  name: 结构体系适用性（越大越好）
  type: metric
  dimension: structure
  # 用条件表达式把结构体系映射成 0–100 的适用性分。取值分档的依据见 source。
  value: "100 if structure_type == '剪力墙' else (95 if structure_type == '框架-剪力墙' else (85 if structure_type == 'MiC' else (80 if structure_type == '钢结构' else 60)))"
  scoring:
    kind: piecewise
    # 表达式本身已经给出 0–100 的分值，这里用恒等映射，不再二次折算。
    points:
      - [0, 0]
      - [100, 100]
  weight_in_dimension: 2
  source: "经验规则（结构组）：住宅结构选型按适用性分档——剪力墙 100（高层住宅主流体系）、框架-剪力墙 95、MiC 85、钢结构 80（二者在住宅中需专项论证）、框架 60（不适用于 16~18 层住宅）。分档参照《超限高层建筑工程抗震设防专项审查技术要点》（建质〔2015〕67号）附件1 表1 的高度超限判定阈值：6 度区框架 60m、框架-抗震墙 130m、抗震墙 140m，框架体系的适用高度明显偏低。分档为组内取值，非规范条文"

- id: S-04
  name: 建筑总高（越小越好）
  type: metric
  dimension: structure
  # height 是派生量（floors * floor_height）。
  value: "height"
  scoring:
    kind: piecewise
    points:
      - [12, 100]
      - [50, 75]
      - [100, 30]
      - [140, 0]
  weight_in_dimension: 1
  source: "经验规则（结构组）：结构风险、抗震要求与单位造价总体随高度上升，故越小越好。分段点以《超限高层建筑工程抗震设防专项审查技术要点》（建质〔2015〕67号）附件1 表1 的高度超限判定阈值为锚点（6 度区抗震墙 140m、框架 60m），140m 归零。分段点为组内取值，非规范条文"

- id: S-05
  name: 建筑高度不超结构体系最大适用高度（6 度区）
  type: hard
  # 只覆盖 JGJ 3—2010 表3.3.1-1 管的**混凝土体系**：框架 60、框架-剪力墙 130、
  # 剪力墙（全部落地）140，单位 m。钢结构与 MiC 不在该表范围内，故 when 把它们排除，
  # 判为「不适用」，而不是硬套别的体系的限值（钢结构需核 JGJ 99，见 open-items）。
  when: "seismic_intensity == '6度(0.05g)' and (structure_type == '框架' or structure_type == '框架-剪力墙' or structure_type == '剪力墙')"
  check: "height <= (60 if structure_type == '框架' else (130 if structure_type == '框架-剪力墙' else 140))"
  message: "建筑总高 {height} m 超过该结构体系在 6 度（0.05g）区的最大适用高度，须改结构体系或按超限高层做专项审查"
  source: "JGJ 3—2010《高层建筑混凝土结构技术规程》第3.3.1条 表3.3.1-1「A 级高度钢筋混凝土高层建筑的最大适用高度（m）」6 度列：框架 60、框架-剪力墙 130、剪力墙（全部落地）140，数值已按原表图逐格核对。同条：平面和竖向均不规则的结构，其最大适用高度宜适当降低。房屋高度超过 A 级限值即属 B 级高度，按建质〔2015〕67号 应做超限高层抗震设防专项审查"

- id: S-06
  name: 建筑高度不超结构体系最大适用高度（7 度区）
  type: hard
  # 同 S-05：只覆盖 JGJ 3—2010 表3.3.1-1 的混凝土体系（7 度列：框架 50、
  # 框架-剪力墙 120、剪力墙 120）。该表 7 度不区分 0.10g / 0.15g，故本条的 7 度
  # 两档通用；钢结构与 MiC 不在该表范围内，判为「不适用」。
  when: "seismic_intensity == '7度(0.10g)' and (structure_type == '框架' or structure_type == '框架-剪力墙' or structure_type == '剪力墙')"
  check: "height <= (50 if structure_type == '框架' else (120 if structure_type == '框架-剪力墙' else 120))"
  message: "建筑总高 {height} m 超过该结构体系在 7 度（0.10g）区的最大适用高度，须改结构体系或按超限高层做专项审查"
  source: "JGJ 3—2010《高层建筑混凝土结构技术规程》第3.3.1条 表3.3.1-1「A 级高度钢筋混凝土高层建筑的最大适用高度（m）」7 度列：框架 50、框架-剪力墙 120、剪力墙（全部落地）120，数值已按原表图逐格核对。该表 7 度列不区分 0.10g 与 0.15g。房屋高度超过 A 级限值即属 B 级高度，按建质〔2015〕67号 应做超限高层抗震设防专项审查"

- id: S-07
  name: 高宽比不超过限值（提示）
  type: hard
  # JGJ 3—2010 第3.3.2条的用词是「不宜」，条文说明明确「在结构设计满足本规程规定的
  # 承载力、稳定、抗倾覆、变形和舒适度等基本要求后，仅从结构安全角度讲高宽比限值
  # 不是必须满足的，主要影响结构设计的经济性」。所以这条定成 warning：只提示、
  # 不踢出排名。数值取表3.3.2 的「6 度、7 度」列（本项目两档都覆盖）。
  # 表标题限定为「钢筋混凝土高层建筑结构」，故钢结构与 MiC 不适用本条。
  when: "structure_type == '框架' or structure_type == '框架-剪力墙' or structure_type == '剪力墙'"
  check: "height_width_ratio <= (4 if structure_type == '框架' else 6)"
  message: "高宽比 {height_width_ratio} 超过 JGJ 3—2010 表3.3.2 的限值（6 度、7 度区：框架 4、框架-剪力墙与剪力墙 6），请复核结构整体稳定与经济性"
  severity: warning
  source: "JGJ 3—2010 第3.3.2条 表3.3.2「钢筋混凝土高层建筑结构适用的最大高宽比」：6 度、7 度区 框架 4、板柱-剪力墙 5、框架-剪力墙与剪力墙 6、框架-核心筒 7、筒中筒 8（数值已按原表逐格核对）。条文用词为「不宜」，条文说明明确该限值不是必须满足、主要影响经济性，故本条只作提示"

- id: S-10
  name: 规则性超限提示（表2 不规则项三项及以上）
  type: hard
  # 建质〔2015〕67号 附件1 表2：同时具有三项及以上不规则的高层建筑，
  # **不论高度是否超过表1**，都属于规则性超限。这里按声明的不规则项计数，
  # 布尔值可直接参与算术（与 S-01 的写法同理）。
  # 严重程度是 warning：超限不等于方案不合理，而是必须走专项审查程序。
  # 表2 注：4a 刚度突变与 4b 尺寸突变属于同类，不重复计数。
  check: "(irregularity_items contains '扭转不规则') + (irregularity_items contains '凹凸不规则') + (irregularity_items contains '楼板不连续') + ((irregularity_items contains '刚度突变') or (irregularity_items contains '尺寸突变')) + (irregularity_items contains '构件间断') + (irregularity_items contains '承载力突变') + (irregularity_items contains '局部不规则') < 3"
  message: "已声明三项及以上不规则项，按建质〔2015〕67号 属规则性超限高层，应进行抗震设防专项审查"
  severity: warning
  source: "《超限高层建筑工程抗震设防专项审查技术要点》建质〔2015〕67号 附件1 表2：同时具有下列三项及三项以上不规则的高层建筑工程（不论高度是否大于表1）——1a 扭转不规则（考虑偶然偏心的扭转位移比大于1.2）、2a 凹凸不规则（平面凹凸尺寸大于相应边长30%等）、3 楼板不连续（有效宽度小于50%、开洞面积大于30%、错层大于梁高）、4a 刚度突变（相邻层刚度变化大于70%，或连续三层变化大于80%）、4b 尺寸突变（竖向构件收进位置高于结构高度20%且收进大于25%，或外挑大于10%和4m）、5 构件间断、6 承载力突变（相邻层受剪承载力变化大于80%）、7 局部不规则。注：序号 a、b 不重复计算不规则项"

- id: S-11
  name: 特殊不规则超限提示（表4 任一项）
  type: hard
  check: "(irregularity_items contains '高位转换') + (irregularity_items contains '厚板转换') + (irregularity_items contains '复杂连接') + (irregularity_items contains '多重复杂') < 1"
  message: "已声明高位转换 / 厚板转换 / 复杂连接 / 多重复杂中的一项，按建质〔2015〕67号 属超限高层，应进行抗震设防专项审查"
  severity: warning
  source: "《超限高层建筑工程抗震设防专项审查技术要点》建质〔2015〕67号 附件1 表4：具有下列某一项不规则的高层建筑工程（不论高度是否大于表1）——1 高位转换（7度超过5层，8度超过3层）；2 厚板转换（7~9度设防）；3 复杂连接；4 多重复杂（同时具有转换层、加强层、错层、连体和多塔等复杂类型中的3种）。表3 的「显著不规则」另需核定，暂未纳入"

- id: S-12
  name: 楼板厚度下限
  type: hard
  # 原名 C-13（写在 compliance.yaml），2026-10 改名为 S-12 并迁入本文件，
  # 使土木类规则统一在 S- 系列，不与建筑侧撞号。判定与出处不变。
  check: "slab_thickness >= 100"
  message: "楼板厚度 {slab_thickness} mm 低于强制要求的 100 mm（GB 55038—2025 第5.0.4条）"
  source: "GB 55038—2025 第5.0.4条：新建住宅建筑的钢筋混凝土结构实心楼板厚度不应小于100mm（全文强制）"

- id: S-13
  name: 结构设计工作年限下限
  type: hard
  # 原名 C-14，2026-10 迁入本文件。
  check: "design_working_life >= 50"
  message: "结构设计工作年限 {design_working_life} 年低于强制要求的 50 年（GB 55038—2025 第2.2.6条）"
  source: "GB 55038—2025 第2.2.6条 表2.2.6：住宅建筑结构的设计工作年限不应低于50年（全文强制）"

- id: S-14
  name: 混凝土强度等级下限
  type: hard
  # 原名 C-18，2026-10 迁入本文件。字段填 C 后的数值：C30 填 30。
  # 钢结构不适用本条（该规范管混凝土结构构件）。
  when: "structure_type != '钢结构'"
  check: "concrete_grade >= 25"
  message: "混凝土强度等级 C{concrete_grade} 低于 GB 55008—2021 规定的 C25（钢筋混凝土结构构件）"
  source: "GB 55008—2021 第2.0.2条 第1款：钢筋混凝土结构构件的混凝土强度等级不应低于C25（全文强制；同款还有 素混凝土C20、预应力混凝土楼板C30、其他预应力C40、钢-混凝土组合结构C30）。同条第2~4款另规定：承受重复荷载、抗震等级不低于二级、采用500MPa及以上钢筋时不应低于C30 —— 这三项需要额外字段，本系统暂未采集；且设计工作年限大于50年时最低强度等级还应提高"
