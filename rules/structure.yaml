# 结构安全评分指标（metric，dimension: structure）与结构相关硬约束。规则 ID 用 S-XX。
#
# 已由专业组核定（2026-10）。本次解决了两件事：
# 1. S-01 不再「数个数」：大悬挑和复杂地质的风险显然不等价，改为**按风险类型加权**；
# 2. 补足结构维度的指标（原只有 S-01 一条，维度分被它独占）：新增 S-03 结构体系
#    适用性（对应「结构选型」）与 S-04 建筑总高（对应「抗震/超限」）。
#
# ⚠️ 仍未覆盖：高宽比、抗震等级、楼板厚度、结构设计工作年限。前两项需要**新增字段**
#    （现有字段算不出高宽比），后两项 GB 55038—2025 有强制要求但本系统没有对应字段，
#    已记入 docs/open-items.md 交给开发组。

- id: S-01
  name: 结构风险特征加权指数（越少越好）
  type: metric
  dimension: structure
  # 不再用 len() 数个数，改为按风险类型对结构安全与专项论证的影响加权。
  # 引擎支持比较与算术，布尔值可直接参与计算，故这种写法是合法的。
  value: "3 * (risk_features contains '大悬挑') + 3 * (risk_features contains '深基坑') + 3 * (risk_features contains '超限构件') + 2 * (risk_features contains '高大空间') + 2 * (risk_features contains '高支模') + 1 * (risk_features contains '超长结构') + 1 * (risk_features contains '不规则建筑') + 1 * (risk_features contains '复杂地质')"
  scoring:
    kind: piecewise
    # 满分为 16 分（3+3+3+2+2+1+1+1）。
    points:
      - [0, 100]
      - [5, 75]
      - [10, 45]
      - [16, 0]
  weight_in_dimension: 2
  source: "经验规则（结构组）：按风险类型对结构安全与专项论证的影响加权——大悬挑、深基坑、超限构件各 3 分（均直接触发专项论证或专门研究），高大空间、高支模各 2 分，超长结构、不规则建筑、复杂地质各 1 分，满分 16 分。权重与分段点为组内取值，非规范条文"

- id: S-02
  name: 钢结构方案须申报人工复核事项（条件硬约束）
  type: hard
  # when 为假（不是钢结构）时，这条规则记为「不适用」，不影响该方案。
  when: "structure_type == '钢结构'"
  # 原写法借用「超限构件」这个预设项，但 GB 55006—2021 全文并无「超限构件」
  # 这一表述，语义对不上。改为要求钢结构方案**显式申报**复核事项：
  # 钢结构规范对新型结构/构件/连接节点与体形复杂的大跨结构都要求专项验证，
  # 申报不出来就提示人工复核。严重程度保持 warning（提示，不踢出排名）。
  check: "len(risk_features) >= 1"
  message: "钢结构方案请在 risk_features 中列出需要人工复核的风险特征（如大悬挑、高大空间、复杂地质）"
  severity: warning
  source: "GB 55006—2021 第4.6.4条：需调整构造措施时，或对于新型结构、构件、连接节点，应通过计算分析和试验验证保证安全要求；第5.3节：体形复杂的大跨度钢结构应采用整体模型计算，并作非线性整体稳定分析与时程分析。本条据此要求钢结构方案显式申报复核事项"

- id: S-03
  name: 结构体系适用性（越大越好）
  type: metric
  dimension: structure
  # 用条件表达式把结构体系映射成 0–100 的适用性分。取值分档的依据见 source。
  value: "100 if structure_type == '剪力墙' else (95 if structure_type == '框架-剪力墙' else (85 if structure_type == 'MiC' else (80 if structure_type == '钢结构' else 60)))"
  scoring:
    kind: piecewise
    # 表达式本身已经给出 0–100 的分值，这里用恒等映射，不再二次折算。
    points:
      - [0, 0]
      - [100, 100]
  weight_in_dimension: 2
  source: "经验规则（结构组）：住宅结构选型按适用性分档——剪力墙 100（高层住宅主流体系）、框架-剪力墙 95、MiC 85、钢结构 80（二者在住宅中需专项论证）、框架 60（不适用于 16~18 层住宅）。分档参照《超限高层建筑工程抗震设防专项审查技术要点》（建质〔2015〕67号）附件1 表1 的高度超限判定阈值：6 度区框架 60m、框架-抗震墙 130m、抗震墙 140m，框架体系的适用高度明显偏低。分档为组内取值，非规范条文"

- id: S-04
  name: 建筑总高（越小越好）
  type: metric
  dimension: structure
  # height 是派生量（floors * floor_height）。
  value: "height"
  scoring:
    kind: piecewise
    points:
      - [12, 100]
      - [50, 75]
      - [100, 30]
      - [140, 0]
  weight_in_dimension: 1
  source: "经验规则（结构组）：结构风险、抗震要求与单位造价总体随高度上升，故越小越好。分段点以《超限高层建筑工程抗震设防专项审查技术要点》（建质〔2015〕67号）附件1 表1 的高度超限判定阈值为锚点（6 度区抗震墙 140m、框架 60m），140m 归零。分段点为组内取值，非规范条文"

- id: S-05
  name: 建筑高度不超结构体系最大适用高度（6 度区）
  type: hard
  # 用条件表达式按结构体系取限值：框架 60、框架-剪力墙 130、剪力墙 140、
  # 钢结构（框架）110，单位 m。MiC 目前没有可引用的限值，故 when 把它排除，
  # 判为「不适用」而不是硬套别的体系。
  # 烈度由项目层的 seismic_intensity 决定（浙江只有 6 度与 7 度两档，见 S-06）。
  when: "seismic_intensity == '6度(0.05g)' and structure_type != 'MiC'"
  check: "height <= (60 if structure_type == '框架' else (130 if structure_type == '框架-剪力墙' else (140 if structure_type == '剪力墙' else 110)))"
  message: "建筑总高 {height} m 超过该结构体系在 6 度（0.05g）区的最大适用高度，须改结构体系或按超限高层做专项审查"
  source: "浙江省《超限高层建筑工程抗震设计导则》（浙江省住房和城乡建设厅，2024-01-10 发布）第3.2.2条 表3.2.2：6 度区混凝土结构最大适用高度 框架 60m、框架-剪力墙 130m、剪力墙 140m；钢结构框架 110m。该组数值与 JGJ 3—2010 第3.3.1条 表3.3.1-1（A 级高度）的 6 度列一致；房屋高度超过 A 级限值即属 B 级高度，按建质〔2015〕67号 应做超限高层抗震设防专项审查。杭州钱塘区按该导则附录A 表A 为 6 度（0.05g）第一组"

- id: S-06
  name: 建筑高度不超结构体系最大适用高度（7 度区）
  type: hard
  when: "seismic_intensity == '7度(0.10g)' and structure_type != 'MiC'"
  check: "height <= (50 if structure_type == '框架' else (120 if structure_type == '框架-剪力墙' else (120 if structure_type == '剪力墙' else 110)))"
  message: "建筑总高 {height} m 超过该结构体系在 7 度（0.10g）区的最大适用高度，须改结构体系或按超限高层做专项审查"
  source: "浙江省《超限高层建筑工程抗震设计导则》第3.2.2条 表3.2.2：7 度区混凝土结构最大适用高度 框架 50m、框架-剪力墙 120m、剪力墙 120m；钢结构框架 110m。与 JGJ 3—2010 第3.3.1条 表3.3.1-1 的 7 度列一致（该表 7 度不区分 0.10g/0.15g）。杭州上城、拱墅、西湖、临平四区按该导则附录A 表A 为 7 度（0.10g）"

- id: S-07
  name: 高宽比不超过限值（提示）
  type: hard
  # JGJ 3—2010 第3.3.2条的用词是「不宜」，条文说明明确「在结构设计满足本规程规定的
  # 承载力、稳定、抗倾覆、变形和舒适度等基本要求后，仅从结构安全角度讲高宽比限值
  # 不是必须满足的，主要影响结构设计的经济性」。所以这条定成 warning：只提示、
  # 不踢出排名。数值取表3.3.2 的「6 度、7 度」列（本项目两档都覆盖）。
  # 表标题限定为「钢筋混凝土高层建筑结构」，故钢结构与 MiC 不适用本条。
  when: "structure_type == '框架' or structure_type == '框架-剪力墙' or structure_type == '剪力墙'"
  check: "height_width_ratio <= (4 if structure_type == '框架' else 6)"
  message: "高宽比 {height_width_ratio} 超过 JGJ 3—2010 表3.3.2 的限值（6 度、7 度区：框架 4、框架-剪力墙与剪力墙 6），请复核结构整体稳定与经济性"
  severity: warning
  source: "JGJ 3—2010 第3.3.2条 表3.3.2「钢筋混凝土高层建筑结构适用的最大高宽比」：6 度、7 度区 框架 4、板柱-剪力墙 5、框架-剪力墙与剪力墙 6、框架-核心筒 7、筒中筒 8（数值已按原表逐格核对）。条文用词为「不宜」，条文说明明确该限值不是必须满足、主要影响经济性，故本条只作提示"

- id: S-08
  name: MiC 建筑最大适用高度（6 度区）
  type: hard
  # MiC 的最大适用高度按体系类型分档，所以必须填 mic_system 才能判；
  # mic_system 没填时本条判为「数据不足」，不会误判为通过。
  when: "structure_type == 'MiC' and seismic_intensity == '6度(0.05g)'"
  check: "height <= (30 if mic_system == '模块化框架结构' else (130 if mic_system == '模块化全预制剪力墙结构' else (90 if mic_system == '模块化叠合剪力墙结构' else (60 if mic_system == '模块化箱模框架结构' else (130 if mic_system == '模块化箱模框架-剪力墙结构' else 140)))))"
  message: "建筑总高 {height} m 超过浙江省《混凝土模块化建筑技术导则》表6.1.8 对 6 度区该 MiC 体系的最大适用高度"
  source: "浙江省《混凝土模块化建筑技术导则》（浙建管发〔2026〕118号，2026-09-10 印发）第6.1.8条 表6.1.8「模块化建筑的最大适用高度（m）」6 度列：模块化框架结构 30、模块化全预制剪力墙结构（全部落地）130、模块化叠合剪力墙结构 90、模块化箱模框架结构 60、模块化箱模框架-剪力墙结构 130、模块化箱模剪力墙结构（全部落地）140。表注 3：超过表内高度的房屋应进行专门研究和论证并采取有效加强措施。表中「部分框支剪力墙」两行需框支层信息，未纳入 mic_system 枚举"

- id: S-09
  name: MiC 建筑最大适用高度（7 度区）
  type: hard
  when: "structure_type == 'MiC' and seismic_intensity == '7度(0.10g)'"
  check: "height <= (30 if mic_system == '模块化框架结构' else (110 if mic_system == '模块化全预制剪力墙结构' else (80 if mic_system == '模块化叠合剪力墙结构' else (50 if mic_system == '模块化箱模框架结构' else (120 if mic_system == '模块化箱模框架-剪力墙结构' else 120)))))"
  message: "建筑总高 {height} m 超过浙江省《混凝土模块化建筑技术导则》表6.1.8 对 7 度区该 MiC 体系的最大适用高度"
  source: "浙江省《混凝土模块化建筑技术导则》（浙建管发〔2026〕118号）第6.1.8条 表6.1.8 7 度列：模块化框架结构 30、模块化全预制剪力墙结构（全部落地）110、模块化叠合剪力墙结构 80、模块化箱模框架结构 50、模块化箱模框架-剪力墙结构 120、模块化箱模剪力墙结构（全部落地）120。注：全预制剪力墙结构在预制墙底剪力占比大于 80% 时应取表中括号内数值（6 度 120、7 度 100），该剪力比本系统尚未采集"
