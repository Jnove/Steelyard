# 危大工程（危险性较大的分部分项工程）判定 + 基坑支护材料要求。规则 ID 用 K-XX（施工维度）。
#
# 依据（均为国家层面）：
# 1. 住房和城乡建设部令第37号《危险性较大的分部分项工程安全管理规定》（2018-06-01 施行，
#    第十条：危大工程须编专项施工方案；第十二条：超过一定规模的危大工程须组织专家论证，
#    专家不少于 5 名）+ 建办质〔2018〕31号 附件1《危险性较大的分部分项工程范围》与
#    附件2《超过一定规模的危险性较大的分部分项工程范围》；
# 2. GB 55003—2021《建筑与市政地基基础通用规范》第7.2节（基坑支护结构材料要求）与
#    第2.1.4条第2款（基坑工程设计工作年限），全文强制。
#
# —— 为什么只把"专家论证档"写成规则 ——
# 附件1（专项施工方案档）对高层住宅几乎**每条都成立**：基坑 ≥3 m、模板支撑 ≥5 m、
# 落地式脚手架 ≥24 m、采用起重机械安装、装配式构件安装、幕墙安装……一个 17 层住宅
# 全部命中。把它们都做成规则，只会给**每个**方案刷同一条提示，对比时没有区分度。
# 因此本文件只做**有阈值、能区分方案**的专家论证档；专项方案档与"无阈值"的条目
# 在下面列明，交给施工组织设计去落实。
#
# —— 本系统暂不判定的危大条目（缺字段或无阈值），原样列出备查 ——
# · 基坑 ≥3 m（附件1 一）—— 只要方案填了开挖深度就能判，需要时再加一条即可；
# · 模板支撑 ≥5 m / 跨度 ≥10 m / 总荷载 ≥10 kN/m² / 集中线荷载 ≥15 kN/m（附件1 二）；
# · 落地式脚手架 ≥24 m（附件1 四·一）—— 同上，需要时加；
# · 附着式升降脚手架、悬挑式脚手架、高处作业吊篮、卸料平台/操作平台、异型脚手架
#   （附件1 四·二~六）—— **采用即属危大**，无阈值；
# · 起重机械安装和拆卸工程、采用起重机械进行安装的工程（附件1 三）——
#   缺"是否为非常规起重设备/单件起吊重量"字段；
# · 装配式建筑混凝土预制构件安装工程（附件1 七·五）—— **采用即属危大**，无阈值；
# · 建筑幕墙安装工程（附件1 七·一）—— 采用即属危大；且**施工高度 ≥50 m 须专家论证**
#   （附件2 七·一）。本项目总高 48~54 m 恰好横跨 50 m 这条线：层数 × 层高 ≥50 m 的方案
#   若采用幕墙，请单独复核这一条（需要"外立面是否含幕墙"字段才能自动判）。
#
# —— 建议专业组留意的一条 ——
# 本项目总高落在 48~54 m，**同时**卡在"落地式脚手架 ≥50 m"与"幕墙 ≥50 m"两条专家论证
# 门槛附近。做方案比选时，50 m 上下意味着施工组织与审批流程的实质差别。

- id: K-03
  name: 深基坑属超过一定规模的危大工程（须专家论证）
  type: hard
  # 触发条件写在 when 里，check 写"未达到阈值"——于是"达到阈值"就判不通过，
  # 提示语里会带上实际数值。下同。
  when: "excavation_depth >= 5"
  check: "excavation_depth < 5"
  message: "基坑开挖深度 {excavation_depth} m 达到 5 m，属超过一定规模的危大工程，专项施工方案须经专家论证"
  severity: warning
  source: "建办质〔2018〕31号 附件2 一：开挖深度超过5m（含5m）的基坑（槽）的土方开挖、支护、降水工程；程序依据为住建部令第37号 第十二条（超过一定规模的危大工程应组织专家论证会，专家不少于5名）"

- id: K-04
  name: 高大模板支撑属超过一定规模的危大工程（须专家论证）
  type: hard
  when: "formwork_height >= 8"
  check: "formwork_height < 8"
  message: "模板支撑搭设高度 {formwork_height} m 达到 8 m，属超过一定规模的危大工程，专项施工方案须经专家论证"
  severity: warning
  source: "建办质〔2018〕31号 附件2 二（二）：混凝土模板支撑工程搭设高度8m及以上，或搭设跨度18m及以上，或施工总荷载（设计值）15kN/m²及以上，或集中线荷载（设计值）20kN/m及以上。本系统只按搭设高度判定（其余三个条件缺字段）。程序依据同 K-03（住建部令第37号 第十二条）"

- id: K-05
  name: 落地式脚手架超高属超过一定规模的危大工程（须专家论证）
  type: hard
  # 只判落地式：附着式升降与悬挑式**一律**属危大（无阈值），做成本条只会让
  # 采用它们的方案每次都刷一条同义提示，见文件头部说明。
  when: "scaffold_type == '落地式钢管脚手架' and scaffold_height >= 50"
  check: "scaffold_height < 50"
  message: "落地式钢管脚手架搭设高度 {scaffold_height} m 达到 50 m，属超过一定规模的危大工程，专项施工方案须经专家论证"
  severity: warning
  source: "建办质〔2018〕31号 附件2 四（一）：搭设高度50m及以上的落地式钢管脚手架工程（附件2 四（二）（三）另有附着式升降提升高度≥150m、悬挑式分段架体高度≥20m 两档）。程序依据同 K-03（住建部令第37号 第十二条）"

# —— 基坑支护结构的材料要求（GB 55003—2021 第7.2节，全文强制）——
# 支护结构是保证基坑及周边环境安全的临时结构，工作年限通常只有一两年，
# 但混凝土强度等级仍有强制下限；这条与 K-03 的深度门槛互为补充：
# K-03 管"要不要专家论证"，以下两条管"支护本身的材料够不够"。

- id: K-06
  name: 排桩桩身混凝土强度等级下限
  type: hard
  when: "retaining_type == '排桩'"
  check: "retaining_concrete_grade >= 25"
  message: "排桩支护的桩身混凝土强度等级 C{retaining_concrete_grade} 低于 GB 55003 要求的 C25"
  source: "GB 55003—2021《建筑与市政地基基础通用规范》第7.2.4条：排桩支护结构的桩身混凝土强度等级不应低于C25。桩的纵向受力钢筋的混凝土保护层厚度不应小于35mm，采用水下灌注工艺时，不应小于50mm（原文逐字核对；保护层属构件级，本系统不判）"

- id: K-07
  name: 两墙合一地下连续墙混凝土强度等级下限
  type: hard
  when: "retaining_type == '地下连续墙' and retaining_wall_two_in_one"
  check: "retaining_concrete_grade >= 30"
  message: "两墙合一地下连续墙的混凝土强度等级 C{retaining_concrete_grade} 低于 GB 55003 要求的 C30"
  source: "GB 55003—2021 第7.2.5条：两墙合一的地下连续墙混凝土强度等级不应低于C30；地下连续墙基坑外侧的纵向受力钢筋的混凝土保护层厚度不应小于70mm；地下连续墙墙体和槽段施工接头应满足防渗设计要求（原文逐字核对）"

# —— 基坑工程的工作年限与内支撑 / 锚拉体系（GB 55003—2021，全文强制）——

- id: K-08
  name: 基坑工程设计工作年限下限
  type: hard
  # 不写 when：没填工作年限时引擎判为「数据不足」，而不是误判为通过。
  check: "excavation_working_life >= 1"
  message: "基坑工程设计工作年限 {excavation_working_life} 年低于规范要求的 1 年"
  source: "GB 55003—2021《建筑与市政地基基础通用规范》第2.1.4条第2款：基坑工程设计应规定工作年限，且设计工作年限不应小于1年（原文逐字核对）。条文说明：支护结构使用期短、设计时荷载通常不考虑长期作用，故须明确其工作年限，避免超越设计状况"

- id: K-09
  name: 混凝土内支撑强度等级下限
  type: hard
  when: "brace_type == '混凝土内支撑'"
  check: "brace_concrete_grade >= 25"
  message: "混凝土内支撑的强度等级 C{brace_concrete_grade} 低于 GB 55003 要求的 C25"
  source: "GB 55003—2021 第7.2.6条：混凝土内支撑结构的混凝土强度等级不应低于C25（原文逐字核对）。混凝土强度等级取内支撑专用字段；不从支护桩墙等级推定"

- id: K-10
  name: 锚杆自由段长度下限
  type: hard
  when: "brace_type == '锚杆（锚拉）'"
  check: "anchor_free_length >= 5"
  message: "锚杆自由段长度 {anchor_free_length} m 小于 GB 55003 要求的 5.0 m"
  source: "GB 55003—2021 第7.2.8条：锚拉结构的锚杆自由段的长度不应小于5.0m，且穿过潜在滑动面进入稳定土层的长度不应小于1.5m；土层锚杆锚固段不应设置在未经处理的软弱土层、不稳定土层和不良地质作用地段（原文逐字核对；「进入稳定土层 ≥1.5m」需要额外的锚固段穿越长度字段，本系统暂未采集）"
