# 湖北册（pack: HB）
#
# **依据文件**：《高品质住宅技术标准》DB42/T 2305-2024
#   发布：湖北省住房和城乡建设厅、湖北省市场监督管理局，2024-11-04 发布 / 2024-12-10 实施；现行。
#   正文来源：湖北省住建厅官网 DOCX 附件（P020240808535694569961.docx），
#   **逐字核对日期：2026-10-13**（该文件正文段落即条文，无字间空格问题）。
#
# 说明：省厅官网同一栏目下另有"征求意见稿"文件，本条所用附件的条号与数值与其一致；
# 正式出版版若条号有出入，以正式版为准（本册记录核对来源，便于复核）。

- id: HB-Q-01
  pack: HB
  name: 湖北高品质住宅层高下限
  type: hard
  check: "floor_height >= 3"
  message: "住宅层高 {floor_height} m 低于湖北省《高品质住宅技术标准》要求的 3 m"
  source: "《高品质住宅技术标准》DB42/T 2305-2024 第6.2节「层高与净高」：住宅层高不应小于3m（湖北省住建厅官网 DOCX 附件逐字核对，2026-10-13）"

- id: HB-Q-02
  pack: HB
  name: 湖北套内主要居住空间净高下限
  type: hard
  check: "clear_height >= 2.6"
  message: "套内主要居住空间净高 {clear_height} m 低于湖北省要求的 2.6 m"
  source: "同上 第6.2节：套内主要居住空间净高不应小于2.6m（公共空间另有：单元主门厅净高不应小于3.0m，单元门厅、电梯厅等净高不应小于2.4m；架空层层高不应小于4.2m、净高不应小于3.6m——这些部位本系统尚未采集，未收）。湖北省住建厅官网 DOCX 附件逐字核对，2026-10-13"

- id: HB-G-01
  pack: HB
  name: 湖北小区绿地率下限
  type: hard
  check: "green_ratio >= 0.35"
  message: "小区绿地率 {green_ratio} 低于湖北省要求的 35%"
  source: "同上 第5.2节「规划控制」：小区绿地率不应小于35%（同条另有：人均集中绿地不低于0.5㎡、大于3公顷地块应配置至少一处不小于400㎡的集中绿地、集中绿地最小宽度大于8m、日照阴影线范围外集中绿地面积占比不小于1/3）。湖北省住建厅官网 DOCX 附件逐字核对，2026-10-13"

- id: HB-G-02
  pack: HB
  name: 湖北人均集中绿地下限
  type: hard
  check: "per_capita_green >= 0.5"
  message: "人均集中绿地 {per_capita_green} m²/人 低于湖北省要求的 0.5 m²/人"
  source: "同上 第5.2节：小区应设置人均不低于0.5㎡的集中绿地（湖北省住建厅官网 DOCX 附件逐字核对，2026-10-13）"
