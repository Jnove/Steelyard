# 居住品质评分指标（metric，dimension: quality）。规则 ID 用 Q-XX。
#
# 已由专业组核定（2026-10）。本维度没有可直接引用的规范数值——规范只对日照、
# 采光、净高设**下限**，不规定「多少算好」，所以三条指标的 source 一律是
# 「经验规则（…组）」，分段点为组内取值，**不冒充条文**。

- id: Q-01
  name: 主要房间南向比例（越大越好）
  type: metric
  dimension: quality
  value: "south_room_ratio"
  scoring:
    kind: piecewise
    # 形态由「适中最好」改为「越大越好」：南向比例是日照与采光条件的直接代理，
    # 原分段点把峰值放在 0.55、0.90 归零，等于认为「南向房间多反而是缺点」，
    # 工程上没有这个道理。规范只设日照下限，不限制南向比例上限。
    points:
      - [0.30, 0]
      - [0.60, 70]
      - [0.85, 100]
  weight_in_dimension: 2
  source: "经验规则（建筑组）：南向比例作为日照与采光条件的代理，比选按越大越好处理；规范只规定日照下限、不限制南向比例上限。分段点为组内取值，非规范条文"

- id: Q-02
  name: 得房率（越大越好）
  type: metric
  dimension: quality
  value: "inner_area_ratio"
  scoring:
    kind: piecewise
    points:
      - [0.70, 0]
      - [0.80, 70]
      - [0.88, 100]
  weight_in_dimension: 1
  source: "经验规则（建筑组）：住宅套内得房率常见区间约 0.75–0.85，低于 0.70 视为明显偏弱。分段点为组内取值，非规范条文"

- id: Q-03
  name: 单栋户数（越小越好，仅高层适用）
  type: metric
  dimension: quality
  # units_per_building 是派生量（units / buildings）。
  value: "units_per_building"
  # 「高层」界限由 7 层改为 10 层：层高 3.00 m 时约 30 m，与高层住宅的
  # 通行界限（建筑高度 27 m）量级一致。这是近似取值，不是条文。
  when: "floors >= 10"
  scoring:
    kind: piecewise
    # 「越小越好」：指标值从小到大，分数递减。
    points:
      - [60, 100]
      - [120, 70]
      - [180, 0]
  weight_in_dimension: 1
  source: "经验规则（建筑组）：单栋户数越大，疏散距离、候梯时间与公共管井负担越重，故越小越好；10 层及以上为高层住宅（层高 3.00 m 时约 30 m，量级对应建筑高度 27 m 的通行界限）。分段点为组内取值，非规范条文"

- id: Q-04
  name: 采光充足度（窗地比，越大越好）
  type: metric
  dimension: quality
  # 采光是居住品质的硬性内容，但**强制指标是采光系数，不是窗地比**：
  # GB 55016—2021 要求卧室、起居室采光等级不低于Ⅳ级（采光系数≥2.0%），
  # 杭州属Ⅳ类光气候区（K=1.10），修正后应≥2.2%。本系统目前**没有采光系数
  # 字段**，只能用窗地面积比近似，因此把这条做成评分指标而不是硬约束。
  value: "window_floor_ratio"
  scoring:
    kind: piecewise
    # 0.167 即 1/6，是 GB 55016—2021 条文说明表2 中Ⅳ级侧面采光的参考值。
    points:
      - [0.12, 0]
      - [0.167, 60]
      - [0.25, 100]
  weight_in_dimension: 1
  source: "经验规则（建筑组）：强制依据是 GB 55038—2025 第6.2.2条「每套住宅卧室、起居室、厨房均应有直接采光」与 GB 55016—2021 第3.2.3条 表3.2.2-1（卧室、起居室采光等级不应低于Ⅳ级，即采光系数≥2.0%；杭州属Ⅳ类光气候区，按 K=1.10 修正后为≥2.2%）。因本系统暂无采光系数字段，本指标以 GB 55016—2021 条文说明表2 的Ⅳ级侧面采光窗地面积比 1/6 作参考锚点；该参考值规范原文明确「不能简单作为设计依据」，故本指标只用于方案初筛，分段点为组内取值，不是强制阈值"
