# 居住品质评分指标
# 所有 points 均为示例评分口径，不代表规范强制限值；正式项目需由专业组确认。

- id: Q-01
  name: 得房率
  type: metric
  dimension: quality
  value: "inner_area_ratio"
  scoring:
    kind: piecewise
    points:
      - [0.70, 0]
      - [0.76, 60]
      - [0.82, 100]
  weight_in_dimension: 2
  source: "《住宅项目规范》GB 55038-2025；条文号：待按正式文本核对；专业判断第6条：住宅建筑应同时满足安全性、适用性和耐久性。评分点为项目偏好口径，非规范强制限值。"

- id: Q-02
  name: 南向房间比例
  type: metric
  dimension: quality
  value: "south_room_ratio"
  scoring:
    kind: piecewise
    points:
      - [0.40, 0]
      - [0.70, 70]
      - [0.85, 100]
  weight_in_dimension: 2
  source: "《住宅项目规范》GB 55038-2025；条文号：待按正式文本核对；原文依据（专业判断第33条）：每套住宅至少应有一个卧室或起居室满足日照标准。比例评分是品质偏好指标，不替代日照核验。"

- id: Q-03
  name: 窗地比
  type: metric
  dimension: quality
  value: "window_floor_ratio"
  scoring:
    kind: piecewise
    points:
      - [0.15, 0]
      - [0.20, 70]
      - [0.28, 100]
  weight_in_dimension: 1
  source: "《住宅项目规范》GB 55038-2025；条文号：待按正式文本核对；原文依据（专业判断第33-35条）：住宅应具备直接采光条件，自然通风开口面积应按房间和阳台关系计算。评分点为项目偏好口径。"

- id: Q-04
  name: 每单元电梯数
  type: metric
  dimension: quality
  value: "elevators_per_unit"
  scoring:
    kind: piecewise
    points:
      - [1, 0]
      - [2, 80]
      - [3, 100]
  weight_in_dimension: 1
  source: "《住宅项目规范》GB 55038-2025；条文号：待按正式文本核对；原文依据（专业判断第26条）：住宅电梯配置与建筑高度、入户层数直接挂钩。硬性最低配置另见 C-05。"

- id: Q-05
  name: 单栋户数
  type: metric
  when: "'Q-05' not in scoring_exclusions"
  dimension: quality
  value: "units_per_building"
  scoring:
    kind: piecewise
    points:
      - [60, 100]
      - [120, 70]
      - [200, 0]
  weight_in_dimension: 1
  source: "项目偏好代理指标，非规范限值；单栋总户数不能直接代表居住品质。保障房尚无单元组织、电梯服务户数与本曲线适用性依据时，应通过项目 scoring_exclusions 暂不计分。参考 GB 55038-2025，条文待核对。"

- id: Q-06
  name: 每栋每层平均户数（品质代理）
  type: metric
  when: "'Q-06' not in scoring_exclusions"
  dimension: quality
  value: "units_per_floor"
  scoring:
    kind: piecewise
    points:
      - [2, 100]
      - [4, 70]
      - [8, 0]
  weight_in_dimension: 1
  source: "项目偏好代理指标，非规范限值；units/(floors*buildings) 是每栋每层平均户数，不能解释成每单元或每台电梯服务户数。保障房尚无交通组织与曲线适用性依据时，应通过项目 scoring_exclusions 暂不计分。参考 GB 55038-2025，条文待核对。"
