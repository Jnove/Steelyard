# 湖南册（pack: HN）
#
# 依据文件：《湖南省好房子建设技术导则（2026版）》，湖南省住房和城乡建设厅，2026-04印发。
# 正文来源：湖南省住建厅官方新闻及 PDF：
# https://zjt.hunan.gov.cn/zjt/gzdt/xwzx/202604/33963302.html
# https://zjt.hunan.gov.cn/zjt/gzdt/xwzx/202604/33963302/files/4a1571e4ab224f1eb68f0ffcd41d2e45.pdf
# 核对日期：2026-10-15。

- id: HN-Q-01
  pack: HN
  name: 湖南每台电梯服务户数上限
  type: hard
  check: "units / total_elevators <= 60"
  message: "每台电梯服务 {units} / {total_elevators} 户，超过湖南导则要求的 60 户上限"
  source: "《湖南省好房子建设技术导则（2026版）》第2.3.3条第2款：每台电梯服务户数不应超过60户（湖南省住建厅官方 PDF，2026-10-15核对）"

- id: HN-Q-02
  pack: HN
  name: 湖南住宅担架无障碍电梯
  type: hard
  when: "elevators_per_unit >= 1"
  check: "has_stretcher_elevator and has_accessible_elevator"
  message: "设有电梯的住宅单元，湖南导则要求至少设置1台可容纳担架的无障碍电梯"
  source: "《湖南省好房子建设技术导则（2026版）》第2.3.3条第1款：设有电梯的住宅单元每个单元至少设置1台可容纳担架的无障碍电梯（湖南省住建厅官方 PDF，2026-10-15核对）"

- id: HN-Q-03
  pack: HN
  name: 湖南交通干线卧室起居室外窗隔声
  type: hard
  severity: warning
  # 当前模型没有外窗 Rw+Ctr 字段，因此保留为人工复核提示，避免把缺字段误判为通过。
  check: "False"
  message: "临近交通干线的卧室、起居室外窗应复核 Rw+Ctr 不小于35dB；系统尚未采集该字段"
  source: "《湖南省好房子建设技术导则（2026版）》第2.8.1条第3款：临近交通干线的卧室、起居室外门窗 Rw+Ctr 不应小于35dB（湖南省住建厅官方 PDF，2026-10-15核对；因缺少隔声字段仅作 warning）"
