# ============================================================================
# 规则文件空白模板
# ============================================================================
#
# 这个文件以下划线开头，引擎和 check_rules 都会**跳过**它，所以可以放心当草稿纸用。
# 要写真规则，请复制下面的骨架到对应的文件里：
#
#   rules/compliance.yaml    规范硬约束        规则 ID 用 C-XX
#   rules/quality.yaml       居住品质评分指标  规则 ID 用 Q-XX
#   rules/structure.yaml     结构安全评分指标  规则 ID 用 S-XX
#   rules/construction.yaml  施工友好评分指标  规则 ID 用 K-XX
#   rules/green.yaml         绿色低碳评分指标  规则 ID 用 G-XX
#
# 完整教程见 docs/rules-guide.md；字段名和单位见 docs/fields.generated.md。
# 改完务必跑一遍：
#
#   uv run --project backend python scripts/check_rules.py
#
# ----------------------------------------------------------------------------
# 三条铁律
# ----------------------------------------------------------------------------
# 1. 缩进用 2 个空格，**绝对不要用 Tab**。
# 2. 字段名和值之间用英文半角冒号 ":"，不要用中文全角 "："。
# 3. 比例类字段一律填 0–1 的小数（0.82 表示 82%），不要填 82。
#
# ----------------------------------------------------------------------------
# 骨架一：硬约束（hard）—— 违反就标红、踢出排名
# ----------------------------------------------------------------------------
#
# - id: C-01                       # 必填。一个前缀字母 + 短横线 + 两位数字，全局唯一
#   name: 规则的中文名              # 必填。给前端和报告看，能直接读懂
#   type: hard                     # 必填。固定写 hard
#   check: "字段名 >= 阈值"          # 必填。布尔表达式，为假即不通过
#   message: "说明，可以插 {字段名}"  # 可选。{字段名} 会被替换成方案里的实际取值
#   when: "结构体系 == '某种值'"      # 可选。只有它为真时才检查 check；为假则记"不适用"
#   severity: error                # 可选。error（默认，标红+踢出排名）或 warning（仅提示）
#   source: "TODO(专业组)：待补"     # 必填。条文出处或经验理由，见指南第 5 节
#
# ----------------------------------------------------------------------------
# 骨架二：评分指标（metric）—— 不踢方案，只给 0–100 分
# ----------------------------------------------------------------------------
#
# - id: Q-01                       # 必填。全局唯一
#   name: 指标的中文名              # 必填
#   type: metric                   # 必填。固定写 metric
#   dimension: quality             # 必填。quality / structure / construction / green 四选一
#   value: "字段名"                 # 必填。字段名，或用字段算出来的表达式
#   scoring:                       # 必填
#     kind: piecewise              # 必填。现阶段只支持 piecewise（分段线性）
#     points:                      # 必填。至少 2 个控制点，每项 [指标值, 分数]
#       - [0.50, 0]                #   指标值必须**从小到大**严格递增
#       - [0.80, 70]               #   分数必须在 0–100 之间
#       - [0.95, 100]              #   「适中最好」就写成分数先升后降
#   weight_in_dimension: 1         # 可选，默认 1。同维度内的相对权重，正数
#   when: "字段名 > 某值"            # 可选。为假时该指标不计入这个方案
#   source: "经验规则（XX组）：理由"   # 必填
#
# ----------------------------------------------------------------------------
# 表达式里能用什么
# ----------------------------------------------------------------------------
# 字段名     见 docs/fields.generated.md（项目层字段 + 方案层字段 + 派生量）
# 运算       + - * / 以及括号
# 比较       >=  <=  >  <  ==  !=
# 逻辑       and  or  not
# 列表判断   风险特征列表 contains '深基坑'
# 函数       min  max  abs  round  len     （只有这五个）
#
# 写错字段名不会被忽略，check_rules 会报错并提示最接近的正确写法。
#
# ----------------------------------------------------------------------------
# 下面留空，复制上面的骨架进来开始写
# ----------------------------------------------------------------------------
