# 施工友好评分指标（metric，dimension: construction）。规则 ID 用 K-XX。
#
# 已由专业组核定（2026-10）。两条指标的 source 都是「经验规则（…组）」：
# 现行规范对「标准化程度」「构件种类数」没有可直接引用的数值限值
# （《装配式建筑评价标准》只给装配率分值与等级，不规定这两个量），
# 因此分段点为组内取值，不冒充条文。

- id: K-01
  name: 标准层重复率（越大越好）
  type: metric
  dimension: construction
  value: "std_floor_repeat"
  scoring:
    kind: piecewise
    points:
      - [0.50, 0]
      - [0.80, 70]
      - [0.95, 100]
  weight_in_dimension: 2
  source: "经验规则（施工组）：标准层重复率越高，模板与爬架的周转次数越多、工期越短、工人重复作业的熟练度与安全性越高；低于 0.50 视为标准化程度不足，0.95 以上接近全标准层。分段点为组内取值，非规范条文"

- id: K-02
  name: 预制构件种类数（越少越好）
  type: metric
  dimension: construction
  value: "component_types"
  scoring:
    kind: piecewise
    # 「越少越好」：指标值从小到大，分数递减。
    points:
      - [8, 100]
      - [20, 60]
      - [40, 0]
  weight_in_dimension: 1
  source: "经验规则（施工组）：构件种类数决定模具套数、堆放场地与现场吊装工序数量，种类越少越利于施工组织与质量稳定；8 种以内视为高度标准化。分段点为组内取值，非规范条文"
