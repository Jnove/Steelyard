- id: K-02
  name: 【示例】预制构件种类数（越少越好）
  type: metric
  dimension: construction
  value: "component_types"
  scoring:
    kind: piecewise
    # 「越少越好」：指标值从小到大，分数递减。
    points:
      - [8, 100]
      - [20, 60]
      - [40, 0]
  weight_in_dimension: 1
