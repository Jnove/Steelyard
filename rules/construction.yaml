- id: K-01
  name: 【示例】标准层重复率（越大越好）
  type: metric
  dimension: construction
  value: "std_floor_repeat"
  scoring:
    kind: piecewise
    points:
      - [0.50, 0]
      - [0.80, 70]
      - [0.95, 100]
  weight_in_dimension: 2
