# 四川册（pack: SC）
#
# **依据文件**：《四川省居住建筑节能设计标准》DB51/T 5027-2024
#   批准：四川省住房和城乡建设厅；施行：2025-01-01。
#   正文来源：四川省住建厅官网"标准规范"栏目 PDF
#   （jst.sc.gov.cn/scjst/bzgf/2025/6/10/.../四川省居住建筑节能设计标准.pdf），
#   **去空格逐字核对日期：2026-10-13**（第 26 页表 4.3.1、第 4.3.2 条）。
#
# 四川把热工区划分为四档，同一指标的限值差别很大：
#   高海拔严寒（Ⅰ）、高海拔寒冷（Ⅱ）、夏热冬冷（Ⅲ）、温和（Ⅳ）。
# 本册目前只收**夏热冬冷**（四川盆地）一档——因为系统的"气候分区"字段
# 分不出"高海拔"与否，川西高原会落到"严寒/寒冷"，与表内的高海拔档并不一一对应。
# 要收川西高原那两档，需要先把气候分区细化到表 4.3.1 的口径（已记入 open-items）。

- id: SC-G-01
  pack: SC
  name: 四川夏热冬冷地区居住建筑体形系数上限
  type: hard
  # 体形系数是派生量（外表面积 ÷ 体积），系统已有 shape_coef。
  when: "climate_zone == '夏热冬冷'"
  check: "shape_coef <= (0.60 if floors <= 3 else 0.40)"
  message: "体形系数 {shape_coef} 超过四川省表4.3.1 对夏热冬冷地区该层数档的限值（≤3 层 0.60、>3 层 0.40）"
  source: "《四川省居住建筑节能设计标准》DB51/T 5027-2024 第4.3.1条 表4.3.1「居住建筑体形系数限值」：夏热冬冷地区（Ⅲ）≤3层 0.60、>3层 0.40；高海拔严寒地区（Ⅰ）0.55/0.30、高海拔寒冷地区（Ⅱ）0.57/0.33、温和地区（Ⅳ）0.60/0.45。条文说明提到高海拔严寒、寒冷地区宜采用「热当量体形系数」代替体形系数指标（官方 PDF 去空格逐字核对，2026-10-13）"

- id: SC-G-02
  pack: SC
  name: 四川居住建筑房间窗墙面积比上限（提示）
  type: hard
  severity: warning
  # 本条按"主要功能房间 0.8 / 非主要功能房间 0.4"控制，而系统采集的是**按朝向**的窗墙比，
  # 两个口径不完全重合：这里用最宽松的 0.8 作上限，只提示明显过大的朝向窗墙比。
  check: "max(window_wall_ratio) <= 0.8"
  message: "存在窗墙面积比 {window_wall_ratio} 超过四川省 4.3.2 条 0.8（主要功能房间）的朝向，请按房间性质复核"
  source: "同上 第4.3.2条：居住建筑的主要功能房间窗墙面积比应小于0.8，非主要功能房间的窗墙面积比应小于0.4（官方 PDF 去空格逐字核对，2026-10-13）。注意：系统的窗墙比是按朝向采集的，与「主要/非主要功能房间」不是同一口径，故本条只作提示"
