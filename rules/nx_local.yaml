# 宁夏册（pack: NX）
#
# **依据文件**：《宁夏高品质商品住宅建设技术导则（试行）》
#   文号：宁建发〔2024〕80号；发布：宁夏回族自治区住房和城乡建设厅，2024-11-28 印发；试行期两年。
#   正文来源：住建厅官网印发的 **DOCX 附件**
#   （https://jst.nx.gov.cn/zwgk/zcwjk/gzwj/202411/t20241129_4744324.html），
#   **逐字核对日期：2026-10-13**（另下载了同批 97 页 PDF 互为印证）。
#
# ⚠️ **适用范围提示**：该导则的对象是**高品质商品住宅**，本项目的样例是**保障性租赁住房**。
#    专业组在给保障房项目启用本册前，需先确认这些口径适用；不适用的项目不要勾选本册。
#
# 该导则里**暂未收进规则**的条目（缺字段，见 docs/regional-packs-inventory.md 的决策清单）：
#   · 第5.4节 人均公共绿地（五分钟生活圈 ≥1.5㎡/人、十分钟 ≥2.0㎡/人）、人均绿地（街坊 ≥1.0㎡/人）；
#   · 「每套住宅应至少有 1 个居住空间获得日照，4 个以上居住空间时至少 2 个」——本册已收，
#     见 NX-Q-02（用"居住空间总数/满足日照空间数"判定）；
#   · 隔声（楼板撞击声 ≤60dB、分户墙 ≥55dB、户门 ≥40dB 等）；
#   · 「4 层及以上住宅设置的电梯应设置无障碍电梯」（需与"是否设无障碍电梯"配合的部位口径）；
#   · 阳台栏杆净高 ≥1.1m、上人屋面女儿墙 ≥1.2m、栏杆垂直杆件净距 ≤0.11m；
#   · 门厅窗地比 ≥1/10；地下/半地下停车位占比 ≥80%。

- id: NX-G-01
  pack: NX
  name: 宁夏高品质商品住宅绿地率下限
  type: hard
  # green_ratio 是 0-1 的小数（0.35 = 35%），与系统其它比例字段口径一致。
  check: "green_ratio >= 0.35"
  message: "住宅绿地率 {green_ratio} 低于宁夏导则要求的 35%"
  source: "《宁夏高品质商品住宅建设技术导则（试行）》（宁建发〔2024〕80号，宁夏回族自治区住房和城乡建设厅 2024-11-28 印发）第5.4节「绿地与活动场地」第1款：住宅绿地率不应小于35%，且满足当地标准（按住建厅官网发布的 DOCX 附件逐字核对，2026-10-13）"

- id: NX-Q-01
  pack: NX
  name: 宁夏起居室与卧室净高下限
  type: hard
  check: "clear_height >= 3.0"
  message: "起居室／卧室空间净高 {clear_height} m 低于宁夏导则要求的 3.0 m"
  source: "同上 第4章「适用性能·套型」：套型主要功能空间面积配置应合理，起居室（厅）供布置家具、设备的连续实墙面长度不应小于3.6m；双人卧室开间净宽不应小于3.0m；起居室、卧室空间净高不应低于3.0m（住建厅官网 DOCX 附件逐字核对，2026-10-13）"

- id: NX-Q-02
  pack: NX
  name: 宁夏套内获日照空间数量
  type: hard
  # 宁夏按"几个居住空间获得日照"判定（不是小时数）；标准日按国标，故不限定标准日。
  check: "daylight_room_count >= 1 and (living_space_count <= 4 or daylight_room_count >= 2)"
  message: "日照不满足：{living_space_count} 个居住空间中仅 {daylight_room_count} 个获得日照（宁夏要求至少 1 个；4 个以上时至少 2 个）"
  source: "同上 第4章「适用性能·套型」：每套住宅应至少有1个居住空间获得日照。当有4个以上居住空间时，应至少有2个居住空间获得日照（住建厅官网 DOCX 附件逐字核对，2026-10-13）"
