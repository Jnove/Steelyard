# 规范硬约束（hard）——违反即标红、默认踢出排名。规则 ID 用 C-XX。
#
# ⚠️ 本文件只放**建筑 / 规划**侧的硬约束。**土木（结构）类的硬约束一律放在
#    `rules/structure.yaml`，用 S-XX 系列**——两边分开是刻意的：建筑与结构由
#    不同的人维护，共用 C- 系列会撞号（S-12 楼板厚度、S-13 结构设计工作年限、
#    S-14 混凝土强度等级就是从这个文件搬过去的）。
#
# 本文件已由专业组按规范原文核定（2026-10）。每条 source 都写明出处：
# 规范原文写「规范编号 第 X 条」，地块条件写「规划条件」，组内判断写「经验规则」。
#
# 关键背景（改本条目前务必先读）：
# - 《住宅项目规范》GB 55038—2025 自 2025-05-01 起施行、**全文强制**，
#   层高 3.00 m、电梯设置等要求以它为准；
# - 《住宅设计规范》GB 50096—2011 虽仍「现行」，但其**强制性条文已全部废止**
#   （7.1.5 窗地比 1/7 由 GB 55015—2021 废止；5.5.2 净高 2.40 m 由
#   GB 55038—2025 废止）。**不要再把 2.40 m、1/7 当强制项。**
#
# 写法教程见 docs/rules-guide.md，字段名与单位见 docs/fields.generated.md。

- id: C-01
  name: 住宅层高下限
  type: hard
  check: "floor_height >= 3.0"
  message: "层高 {floor_height} m 低于强制要求的 3.00 m（GB 55038—2025 第4.1.2条）"
  source: "GB 55038—2025 第4.1.2条：新建住宅建筑的层高不应低于3.00m（全文强制，2025-05-01 施行）"

- id: C-02
  name: 容积率不超地块上限
  type: hard
  # far 是派生量（gfa / site_area），far_max 是项目层填的地块上限。
  check: "far <= far_max"
  message: "容积率 {far} 超过地块上限 {far_max}"
  source: "地块规划条件（控制性详细规划 / 土地出让合同）：容积率上限属地块法定约束，非规范条文；以项目录入的 far_max 为准"

- id: C-03
  name: 建筑总高不超限高
  type: hard
  # height 是派生量（floors * floor_height）。
  # severity 由 warning 改为 error：限高来自地块规划条件，突破即不可建，
  # 不属于「提示性」问题。原 warning 只是为演示两种严重程度。
  check: "height <= height_max"
  message: "建筑总高 {height} m 超过限高 {height_max} m"
  source: "地块规划条件（控制性详细规划 / 土地出让合同）：限高属地块法定约束，突破即不可建，非规范条文"

- id: C-04
  name: 四层及以上须设电梯
  type: hard
  # 规范原文的条件是「最高入户层为四层及以上，或最高入户层楼面距室外设计地面
  # 高度超过 9m」。本系统用 floors >= 4 近似：层高已达 3.00m（见 C-01）时，
  # 4 层即 12m > 9m，两层条件在常见住宅中同时成立。
  when: "floors >= 4"
  check: "elevators_per_unit >= 1"
  message: "最高入户层 {floors} 层，按 GB 55038—2025 每个住宅单元应至少设 1 台电梯，当前 {elevators_per_unit} 台"
  source: "GB 55038—2025 第4.2.4条：最高入户层为四层及四层以上，或最高入户层楼面距室外设计地面高度超过9m的住宅建筑，每个住宅单元应至少设置1台电梯（全文强制）"

- id: C-05
  name: 十二层及以上每单元不少于两台电梯
  type: hard
  when: "floors >= 12"
  check: "elevators_per_unit >= 2"
  message: "最高入户层 {floors} 层，按 GB 55038—2025 每个住宅单元应至少设 2 台电梯，当前 {elevators_per_unit} 台"
  source: "GB 55038—2025 第4.2.4条：最高入户层为十二层及十二层以上，或最高入户层楼面距室外设计地面高度超过33m的住宅建筑，每个住宅单元应至少设置2台电梯（全文强制）"

- id: C-06
  name: 南向窗墙面积比不超限
  type: hard
  check: "window_wall_ratio['南'] <= 0.45"
  message: "南向窗墙面积比超过 0.45 的限值（GB 55015—2021 第3.1.4条、DB33/1015—2021 第4.2.1条）"
  source: "GB 55015—2021 第3.1.4条 表3.1.4（夏热冬冷地区南向≤0.45，全文强制）；DB33/1015—2021 第4.2.1条 表4.2.1（南向平均窗墙面积比≤0.45，浙江省强制性条文）"

- id: C-07
  name: 北向窗墙面积比不超限
  type: hard
  check: "window_wall_ratio['北'] <= 0.40"
  message: "北向窗墙面积比超过 0.40 的限值（GB 55015—2021 第3.1.4条、DB33/1015—2021 第4.2.1条）"
  source: "GB 55015—2021 第3.1.4条 表3.1.4（夏热冬冷地区北向≤0.40，全文强制）；DB33/1015—2021 第4.2.1条 表4.2.1（北向平均窗墙面积比≤0.40，浙江省强制性条文）"

- id: C-08
  name: 东、西向窗墙面积比不超限
  type: hard
  # 国标与浙江地标都管东西向，但限值不同（国标 0.35、浙江 0.25），
  # 从严取浙江值。东西向是夏季得热的主要来源，浙江作为强制性条文收紧。
  check: "window_wall_ratio['东'] <= 0.25 and window_wall_ratio['西'] <= 0.25"
  message: "东向或西向窗墙面积比超过 0.25 的限值（DB33/1015—2021 第4.2.1条）"
  source: "DB33/1015—2021 第4.2.1条 表4.2.1：居住建筑不同朝向平均窗墙面积比限值 东、西向≤0.25（浙江省强制性条文；国标 GB 55015—2021 第3.1.4条同朝向为≤0.35，从严取地方值）"

- id: C-09
  name: 建筑密度不超地块上限
  type: hard
  # density 是派生量（footprint / site_area），density_max 是项目层填的地块上限。
  # 这条与 C-02（容积率）、C-03（限高）同属地块规划条件，补齐后三项地块上限
  # 都有规则把关——此前 density_max 字段存在但没有任何规则引用。
  check: "density <= density_max"
  message: "建筑密度 {density} 超过地块上限 {density_max}"
  source: "地块规划条件（控制性详细规划 / 土地出让合同）：建筑密度上限属地块法定约束，非规范条文；以项目录入的 density_max 为准"

- id: C-10
  name: 建筑密度不超国标强制上限
  type: hard
  # 与 C-09 的分工：C-09 管"地块条件自己写的上限"，这条管"国家标准允许的上限"。
  # 地块条件可以比国标更严，但不能更松——原虚构项目把 density_max 填到 28%，
  # 就已经超过国标强制值了。
  when: "floors >= 10 and floors <= 26"
  check: "density <= 0.22"
  message: "建筑密度 {density} 超过 GB 50180—2018 规定的 22%（Ⅲ 气候区高层住宅）"
  source: "GB 50180—2018 第4.0.2条（强制性条文）表4.0.2：居住街坊用地与建筑控制指标——Ⅲ、Ⅳ、Ⅴ 建筑气候区（杭州属 Ⅲ 区）高层住宅 10~26 层建筑密度最大值 22%。按层数近似对应表中「住宅建筑平均层数类别」"

- id: C-11
  name: 建筑高度不超国标控制最大值（高层Ⅰ类）
  type: hard
  # 表4.0.2 的「住宅建筑高度控制最大值」是按平均层数类别给的：
  # 高层Ⅰ类（10~18 层）54 m，高层Ⅱ类（19~26 层）80 m（见 C-12）。
  when: "floors >= 10 and floors <= 18"
  check: "height <= 54"
  message: "建筑总高 {height} m 超过 GB 50180—2018 对高层Ⅰ类住宅的 54 m 控制值"
  source: "GB 50180—2018 第4.0.2条（强制性条文）表4.0.2：Ⅲ、Ⅳ、Ⅴ 建筑气候区（杭州属 Ⅲ 区）高层Ⅰ类（10~18 层）住宅建筑高度控制最大值 54 m"

- id: C-12
  name: 建筑高度不超国标控制最大值（高层Ⅱ类）
  type: hard
  when: "floors >= 19 and floors <= 26"
  check: "height <= 80"
  message: "建筑总高 {height} m 超过 GB 50180—2018 对高层Ⅱ类住宅的 80 m 控制值"
  source: "GB 50180—2018 第4.0.2条（强制性条文）表4.0.2：Ⅲ、Ⅳ、Ⅴ 建筑气候区（杭州属 Ⅲ 区）高层Ⅱ类（19~26 层）住宅建筑高度控制最大值 80 m"

- id: C-15
  name: 采光系数下限
  type: hard
  # 字段用小数：0.022 即 2.2%。
  check: "daylight_factor >= 0.022"
  message: "采光系数 {daylight_factor} 低于杭州要求的 0.022（即 2.2%）（GB 55016—2021 第3.2.3条）"
  source: "GB 55016—2021 第3.2.3条 表3.2.2-1：住宅卧室、起居室的采光等级不应低于Ⅳ级，侧面采光采光系数不应低于 2.0%；杭州属Ⅳ类光气候区，按 GB 50033—2013 第3.0.4条 光气候系数 K=1.10 修正后为 2.2%。本字段按项目约定用小数，0.022 即 2.2%"

- id: C-16
  name: 日照时数下限
  type: hard
  check: "sunlight_hours >= 2"
  message: "日照时数 {sunlight_hours} h 低于杭州要求的 2 h（GB 50180—2018 第4.0.9条）"
  source: "GB 50180—2018 第4.0.9条（强制性条文）表4.0.9：Ⅰ、Ⅱ、Ⅲ、Ⅶ 建筑气候区且城区常住人口≥50万的城市，大寒日日照时数不应低于 2h；有效日照时间带 8:00~16:00（当地真太阳时），计算起点为底层窗台面。杭州属 Ⅲ 建筑气候区且为特大城市"

- id: C-17
  name: 绿地率下限
  type: hard
  # 字段用小数：0.35 即 35%。
  check: "green_ratio >= 0.35"
  message: "绿地率 {green_ratio} 低于国标要求的 0.35（即 35%）（GB 50180—2018 第4.0.2条）"
  source: "GB 50180—2018 第4.0.2条（强制性条文）表4.0.2：Ⅲ、Ⅳ、Ⅴ 建筑气候区（杭州属 Ⅲ 区）高层住宅绿地率最小值 35%。本字段按项目约定用小数，0.35 即 35%"
