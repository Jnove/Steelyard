# 宁夏册（pack: NX）：宁夏回族自治区的地方要求。
#
# **依据文件**：《宁夏高品质商品住宅建设技术导则（试行）》
#   文号：宁建发〔2024〕80号；发布：宁夏回族自治区住房和城乡建设厅，2024-11-28 印发；试行期两年。
#   正文来源：住建厅官网印发的 **DOCX 附件**（https://jst.nx.gov.cn/zwgk/zcwjk/gzwj/202411/t20241129_4744324.html），
#   **逐字核对日期：2026-10-13**（97 页 PDF 与 DOCX 均由本地解析，非二手转录）。
#
# ⚠️ **适用范围提示**：该导则的对象是**高品质商品住宅**，本项目的样例是**保障性租赁住房**。
#    专业组在给保障房项目启用本册前，需先确认这条口径适用；不适用的项目不要勾选本册。
#
# 该导则里**暂未收进规则**的条目（缺字段，见 docs/regional-packs-inventory.md 的决策清单）：
#   · 第5.4节 人均公共绿地（五分钟生活圈 ≥1.5㎡/人、十分钟 ≥2.0㎡/人）、人均绿地（街坊 ≥1.0㎡/人）；
#   · 第4.x节「起居室、卧室空间净高不应低于 3.0m」（系统现有字段是**层高**，净高是另一个量）；
#   · 「每套住宅应至少有 1 个居住空间获得日照，4 个以上居住空间时至少 2 个」（需要"居住空间数"与"获日照空间数"）；
#   · 隔声（楼板撞击声 ≤60dB、分户墙 ≥55dB、户门 ≥40dB 等）、无障碍电梯、阳台与女儿墙栏杆净高等。

- id: NX-G-01
  pack: NX
  name: 宁夏高品质商品住宅绿地率下限
  type: hard
  # green_ratio 是 0-1 的小数（0.35 = 35%），与系统其它比例字段口径一致。
  check: "green_ratio >= 0.35"
  message: "住宅绿地率 {green_ratio} 低于宁夏导则要求的 35%"
  source: "《宁夏高品质商品住宅建设技术导则（试行）》（宁建发〔2024〕80号，宁夏回族自治区住房和城乡建设厅 2024-11-28 印发）第5.4节「绿地与活动场地」第1款：住宅绿地率不应小于35%，且满足当地标准（按住建厅官网发布的 DOCX 附件逐字核对，核对日期 2026-10-13）"
