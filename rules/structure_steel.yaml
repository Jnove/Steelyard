# 钢结构规则。规则 ID 用 S-XX（前缀按维度选，文件按主题分）。
#
# 依据：**GB/T 50011—2010（2024年版）《建筑抗震设计标准》第8.1节**（国家层面标准）。
# 表8.1.1（最大适用高度）与表8.1.2（最大高宽比）的数值均由**原表图逐格核对**得到，
# 可直接对照原文。
#
# 为什么单独一册：混凝土体系的最大适用高度走 JGJ 3—2010 表3.3.1-1（见 structure.yaml
# 的 S-05/S-06），钢结构走 GB/T 50011 表8.1.1——两套表的结构类型划分与数值都不同，
# 最容易犯的错就是"给钢结构套了混凝土的限值"（例如把钢结构按剪力墙的 140 m 判）。
#
# 本系统暂不判定的钢结构条目：
# · 第8.1.5条：甲、乙类建筑和高层的丙类建筑不应采用单跨框架——需要"是否单跨框架"字段；
# · 第8.1.9条第2款：超过 50 m 的钢结构房屋基础埋深（天然地基不宜小于 H/15、
#   桩基桩承台不宜小于 H/20）——需要"基础埋深"字段；"应设置地下室"这一半已落成 S-21；
# · 第8.1.3条 钢结构抗震等级、第8.1.6条 支撑布置、第8.1.8条 楼盖做法——构件/构造级，
#   不是方案层能判的。

- id: S-19
  name: 钢结构建筑高度不超体系最大适用高度
  type: hard
  # 本项目可选的 6 度(0.05g) 与 7 度(0.10g) 同属表8.1.1 的「6、7 度(0.10g)」列，
  # 故取一列即可；表内其余列（7 度 0.15g、8 度、9 度）本系统的烈度选项暂不覆盖。
  # steel_system 未填时本条判为「数据不足」，不会误判为通过。
  when: "structure_type == '钢结构'"
  check: "height <= (110 if steel_system == '框架' else (220 if steel_system == '框架-中心支撑' else (240 if steel_system == '框架-偏心支撑（延性墙板）' else 300)))"
  message: "钢结构建筑总高 {height} m 超过该体系在 6、7 度（0.10g）区的最大适用高度（框架 110、框架-中心支撑 220、框架-偏心支撑 240、筒体和巨型框架 300 m），须改体系或按超限高层做专项审查"
  source: "GB/T 50011—2010（2024年版）第8.1.1条 表8.1.1「钢结构房屋适用的最大高度（m）」6、7 度（0.10g）列：框架 110、框架-中心支撑 220、框架-偏心支撑（延性墙板）240、筒体（框筒、筒中筒、桁架筒、束筒）和巨型框架 300（原表图逐格核对）。表注 2：超过表内高度的房屋，应进行专门研究和论证，采取有效的加强措施"

- id: S-20
  name: 钢结构高宽比不超限值（提示）
  type: hard
  # 表8.1.2 只按烈度分档（6、7 度 6.5 / 8 度 6.0 / 9 度 5.5），与体系无关。
  when: "structure_type == '钢结构'"
  check: "height_width_ratio <= 6.5"
  message: "钢结构高宽比 {height_width_ratio} 超过表8.1.2 在 6、7 度区的限值 6.5，请复核结构整体稳定与经济性"
  severity: warning
  source: "GB/T 50011—2010（2024年版）第8.1.2条 表8.1.2「钢结构民用房屋适用的最大高宽比」：烈度 6、7 度 6.5、8 度 6.0、9 度 5.5（原表图逐格核对）。条文本条用词为「不宜」，故只作提示。表注：塔形建筑的底部有大底盘时，高宽比可按大底盘以上计算"

- id: S-21
  name: 超过 50 m 的钢结构房屋应设置地下室
  type: hard
  when: "structure_type == '钢结构' and height > 50"
  check: "has_basement"
  message: "钢结构建筑总高 {height} m 超过 50 m，按规范应设置地下室"
  source: "GB/T 50011—2010（2024年版）第8.1.9条第2款：超过50m的钢结构房屋应设置地下室。其基础埋置深度，当采用天然地基时不宜小于房屋总高度的1/15；当采用桩基时，桩承台埋深不宜小于房屋总高度的1/20（埋深部分需要“基础埋深”字段，本系统暂未采集）"
