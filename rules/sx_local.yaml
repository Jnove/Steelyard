# 山西册（pack: SX）
#
# **依据文件**：山西省工程建设地方标准《宜居住宅建设标准》DBJ04/T 437-2022
#   批准：山西省住房和城乡建设厅；施行：2023-03-01。
#   正文来源：山西省住建厅官网 PDF（P020230201370312367462.pdf），
#   **去空格逐字核对日期：2026-10-13**。
#
# 山西的日照口径与国标不同：国标给大寒日 2h／冬至日 1h 两档，
# 山西明确按**冬至日累计 1 小时**（有条件的提高到冬至日累计 2 小时）。

- id: SX-Q-01
  pack: SX
  name: 山西宜居住宅层高下限
  type: hard
  # 设新风系统时加严到 3.2m。has_fresh_air 未填时本条判为数据不足，不会误判通过。
  check: "floor_height >= (3.2 if has_fresh_air else 3.0)"
  message: "层高 {floor_height} m 低于山西省《宜居住宅建设标准》要求（一般 3.0 m；设新风系统时 3.2 m）"
  source: "山西省工程建设地方标准《宜居住宅建设标准》DBJ04/T 437-2022 第5.2.11条：住宅层高应大于等于3.0米；户内设置新风系统时，层高不应低于3.2米（官方 PDF 去空格逐字核对，2026-10-13）"

- id: SX-Q-02
  pack: SX
  name: 山西宜居住宅日照（冬至日累计 1h）
  type: hard
  when: "daylight_standard_day == '冬至日'"
  check: "sunlight_hours >= 1"
  message: "日照时数 {sunlight_hours} h 低于山西省要求的冬至日累计 1 h"
  source: "同上 第4.2.2条：建筑规划布局不得降低周边建筑的日照标准，新建宜居住宅的日照标准应满足冬至日累计1小时的要求，有条件的应提高标准，达到冬至日累计2小时（官方 PDF 去空格逐字核对，2026-10-13）"

- id: SX-Q-03
  pack: SX
  name: 山西日照标准日核对（提示）
  type: hard
  severity: warning
  when: "daylight_standard_day == '大寒日'"
  check: "False"
  message: "本项目日照按大寒日分析，而山西按冬至日累计判定，SX-Q-02 无法给出结论；请补充冬至日日照分析"
  source: "同上 第4.2.2条以「冬至日累计」为日照标准（国标给的是大寒日 2h／冬至日 1h 两档，山西明确取冬至日）。标准日不一致时本条只作提示，本系统不替使用者换算"

- id: SX-G-01
  pack: SX
  name: 山西宜居住宅绿地率下限
  type: hard
  check: "green_ratio >= 0.30"
  message: "绿地率 {green_ratio} 低于山西省《宜居住宅建设标准》表4.2.1 要求的 30%"
  source: "同上 表4.2.1「宜居住宅居住区用地控制指标」：低层 绿地率 30%、多层Ⅰ类 30%、多层Ⅱ类 30%、高层Ⅰ类 35%（表内另有容积率与建筑密度上限，需按层数档判定，本系统暂未收）。官方 PDF 去空格逐字核对，2026-10-13"
