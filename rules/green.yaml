- id: G-01
  name: 【示例】体形系数（越小越好）
  type: metric
  dimension: green
  # shape_coef 是派生量（envelope_area / volume）。
  value: "shape_coef"
  scoring:
    kind: piecewise
    points:
      - [0.20, 100]
      - [0.35, 70]
      - [0.60, 0]
  weight_in_dimension: 2
