# 绿色低碳与施工友好评分指标
# points 是项目评分口径；规范控制项不能由评分项替代。

- id: G-01
  name: 预估装配率
  type: metric
  dimension: green
  value: "prefab_ratio_est"
  scoring:
    kind: piecewise
    points:
      - [0.20, 0]
      - [0.50, 60]
      - [0.75, 100]
  weight_in_dimension: 2
  source: "《装配式建筑评价标准》GB/T 51129-2017；条文号：待按正式文本核对；原文依据（专业判断第10、20-24条）：装配率不得低于 50%，达到基本认定条件后按装配率区间划分等级。"

# G-02 / G-03 已合并至 K-01 / K-02（2026-10-22）：同一输入只计权一次。
# 保留施工组已声明为经验口径的曲线，旧编号不再加载，历史报告仍按原版本解释。

- id: G-04
  name: 体形系数
  type: metric
  dimension: green
  value: "shape_coef"
  scoring:
    kind: piecewise
    points:
      - [0.20, 100]
      - [0.35, 70]
      - [0.50, 0]
  weight_in_dimension: 2
  source: "《建筑节能与可再生能源利用通用规范》GB 55015-2021；条文号：待按正式文本核对；原文依据（专业判断第6-12条）：建筑体形和围护结构应作为首要节能控制对象。"

- id: G-05
  name: 楼层效率
  type: metric
  when: "'G-05' not in scoring_exclusions"
  dimension: green
  value: "floor_efficiency"
  scoring:
    kind: piecewise
    points:
      - [0.65, 0]
      - [0.80, 70]
      - [0.95, 100]
  weight_in_dimension: 1
  source: "项目偏好代理指标，非规范限值；面积口径与绿色性能解释待专业核定。若基底由 gfa/floors 反推，本量恒约为1，不能证明绿色优势，应通过项目 scoring_exclusions 暂不计分。参考 GB/T 50378-2019，条文及2024年版适用性待核对。"
