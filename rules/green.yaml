# 绿色低碳与施工友好评分指标
# points 是项目评分口径；规范控制项不能由评分项替代。

- id: G-01
  name: 预估装配率
  type: metric
  dimension: green
  value: "prefab_ratio_est"
  scoring:
    kind: piecewise
    points:
      - [0.20, 0]
      - [0.50, 60]
      - [0.75, 100]
  weight_in_dimension: 2
  source: "《装配式建筑评价标准》GB/T 51129-2017；条文号：待按正式文本核对；原文依据（专业判断第10、20-24条）：装配率不得低于 50%，达到基本认定条件后按装配率区间划分等级。"

- id: G-02
  name: 标准层重复率
  type: metric
  dimension: construction
  value: "std_floor_repeat"
  scoring:
    kind: piecewise
    points:
      - [0.50, 0]
      - [0.80, 70]
      - [0.95, 100]
  weight_in_dimension: 2
  source: "《装配式建筑评价标准》GB/T 51129-2017；条文号：待按正式文本核对；原文依据（专业判断第25-29条）：标准化和模数协调有助于提高真实装配化水平，应减少非标构件及现场切割。"

- id: G-03
  name: 预制构件种类数
  type: metric
  dimension: construction
  value: "component_types"
  scoring:
    kind: piecewise
    points:
      - [8, 100]
      - [14, 60]
      - [20, 0]
  weight_in_dimension: 1
  source: "《装配式建筑评价标准》GB/T 51129-2017；条文号：待按正式文本核对；原文依据（专业判断第27-29条）：应优先采用重复性高、尺寸协调、接口统一的构件和部品，减少非标构件及现场二次加工。"

- id: G-04
  name: 体形系数
  type: metric
  dimension: green
  value: "shape_coef"
  scoring:
    kind: piecewise
    points:
      - [0.20, 100]
      - [0.35, 70]
      - [0.50, 0]
  weight_in_dimension: 2
  source: "《建筑节能与可再生能源利用通用规范》GB 55015-2021；条文号：待按正式文本核对；原文依据（专业判断第6-12条）：建筑体形和围护结构应作为首要节能控制对象。"

- id: G-05
  name: 楼层效率
  type: metric
  dimension: green
  value: "floor_efficiency"
  scoring:
    kind: piecewise
    points:
      - [0.65, 0]
      - [0.80, 70]
      - [0.95, 100]
  weight_in_dimension: 1
  source: "《绿色建筑评价标准》GB/T 50378-2019；条文号：待按正式文本核对；原文依据（专业判断第28-34条）：节地与土地利用应以集约、高效和减少生态扰动为目标。需同步核对 2024 年版及地方实施文件。"
