# 河北册（pack: HE）
#
# **依据文件**：河北省工程建设地方标准《七十年住宅建筑设计标准》DB13(J)/T 8431-2021
#   发布：河北省住房和城乡建设厅 2021-09-09 第134号公告批准发布。
#   正文来源：河北省住建厅官网 PDF（P020220402508028852517.pdf），
#   **去空格逐字核对日期：2026-10-13**（该 PDF 抽出的文字每字之间带空格，
#   必须去掉全部空白后再定位条款，否则会漏）。
#
# 只收**全省适用**的条文；市级文件（如《石家庄市城乡规划管理技术规定》）另案处理。

- id: HE-Q-01
  pack: HE
  name: 河北七十年住宅层高下限
  type: hard
  check: "floor_height >= 3.00"
  message: "层高 {floor_height} m 低于河北省《七十年住宅建筑设计标准》要求的 3.00 m"
  source: "河北省工程建设地方标准《七十年住宅建筑设计标准》DB13(J)/T 8431-2021 第6.2.3条第1款：层高不应低于3.00m且不宜高于3.60m（官方 PDF 去空格逐字核对，2026-10-13）"

- id: HE-Q-02
  pack: HE
  name: 河北七十年住宅日照（大寒日 2h，按空间数）
  type: hard
  # 河北按"几个居住空间满足"判定，不是按小时数；标准日固定为大寒日。
  # daylight_standard_day 不是大寒日时本条不适用，由 HE-Q-03 给提示。
  when: "daylight_standard_day == '大寒日'"
  check: "daylight_room_count >= 1 and (living_space_count <= 4 or daylight_room_count >= 2)"
  message: "日照不满足：{living_space_count} 个居住空间中仅 {daylight_room_count} 个达到大寒日 2h（河北要求至少 1 个；4 个以上时至少 2 个）"
  source: "同上 第6.2.5条：每套住宅至少应有一个居住空间能获得大寒日两小时日照；当有4个以上居住空间时，其中2个或2个以上居住空间应能获得大寒日两小时日照（官方 PDF 去空格逐字核对，2026-10-13）"

- id: HE-Q-03
  pack: HE
  name: 河北日照标准日核对（提示）
  type: hard
  severity: warning
  when: "daylight_standard_day == '冬至日'"
  check: "False"
  message: "本项目日照按冬至日分析，而河北按大寒日判定，HE-Q-02 无法给出结论；请补充大寒日日照分析"
  source: "同上 第6.2.5条以「大寒日」为日照标准日。标准日不一致时本条只作提示——不同标准日的日照时数不能互相换算，本系统不替使用者换算"
