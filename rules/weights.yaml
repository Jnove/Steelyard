# ============================================================================
# 角色权重模板（AHP 两两比较矩阵）
# ============================================================================
#
# 这个文件**不是规则列表**，check_rules 会用另一套检查处理它。
# 它回答的问题是：「站在不同人的立场上，四个维度谁更重要？」
#
# 前端的「按角色排序」下拉框就是读这四个模板；用户也可以拖滑杆自己给权重，
# 那条路不经过这个文件。
#
# ⚠️ 四个矩阵当前都是**占位数值**：一致性都合格（CR < 0.1），角色之间的侧重也
#    确实拉开了，但**没有经过专业组核定**。定稿前不要拿它跑的排名对外。
#    待办见 docs/open-items.md。
#
# ----------------------------------------------------------------------------
# 怎么读、怎么改
# ----------------------------------------------------------------------------
# 四个维度的顺序**固定**为：
#
#        quality（居住品质）  structure（结构安全）
#        construction（施工友好）  green（绿色低碳）
#
# 矩阵是 4×4，第 i 行第 j 列的值表示「第 i 个维度比第 j 个维度重要多少倍」：
#
#        1    两者一样重要
#        3    第 i 个稍微更重要
#        5    第 i 个明显更重要
#        7    第 i 个强烈更重要
#        9    第 i 个极端更重要
#        2 4 6 8    上面几档之间的折中
#        1/3 1/5 …  反过来，第 j 个更重要
#
# 三条硬性要求（写错 check_rules 会报错并告你怎么改）：
#
#   1. 对角线必须全是 1（自己和自己一样重要）；
#   2. 必须互反：如果 a[i][j] 写了 3，那么 a[j][i] 必须写 1/3；
#   3. 判断不能自相矛盾得太厉害。引擎会算一个「一致性比率 CR」，
#      **CR 必须小于 0.1**。比如你说「A 比 B 重要 3 倍、B 比 C 重要 3 倍」，
#      那 A 比 C 就该在 9 倍上下；写成 1/2 就会把 CR 顶上去。
#
# 分数直接写成 `1/3` 这种形式即可（不要写 0.33，四舍五入会破坏上面的互反检查）。
#
# 改完务必跑一遍：
#
#     uv run --project backend python scripts/check_rules.py
#
# ----------------------------------------------------------------------------
# 也可以跳过矩阵直接给权重
# ----------------------------------------------------------------------------
# 如果某个角色的权重是上级直接规定的（不是你们推出来的），可以用 weights 代替
# matrix，四个数按上面的维度顺序写，引擎会自动归一化：
#
#     some_role:
#       name: 某个角色
#       weights: [0.4, 0.2, 0.3, 0.1]
#       source: "XX 文件规定"
#
# 这种写法没有一致性检验可做（没有矩阵），CR 会记为空。
# ============================================================================

government:
  name: 政府 / 保障房平台
  note: >-
    居住品质与绿色低碳并重（「为人民建好房」与双碳目标都是考核项），
    结构安全作为底线要求次之，施工友好主要由承包方承担，权重最低。
  source: "【示例】TODO(专业组)：占位矩阵，一致性合格但数值待核定"
  #          quality  structure  construction  green
  matrix:
    - [1,     2,     4,     1]      # quality
    - [1/2,   1,     2,     1/2]    # structure
    - [1/4,   1/2,   1,     1/4]    # construction
    - [1,     2,     4,     1]      # green

developer:
  name: 开发企业
  note: >-
    居住品质是卖点，施工友好直接决定工期与成本，两者接近；
    结构安全按规范做到即可，绿色低碳在没有强制指标时投入意愿最低。
  source: "【示例】TODO(专业组)：占位矩阵，一致性合格但数值待核定"
  #          quality  structure  construction  green
  matrix:
    - [1,     3,     1,     4]      # quality
    - [1/3,   1,     1/3,   2]      # structure
    - [1,     3,     1,     3]      # construction
    - [1/4,   1/2,   1/3,   1]      # green

contractor:
  name: 施工总包
  note: >-
    施工友好压倒性重要（标准化程度直接决定工期、模板周转与工友安全），
    结构安全次之（风险特征越少越好施工），居住品质与绿色低碳不由自己决定。
  source: "【示例】TODO(专业组)：占位矩阵，一致性合格但数值待核定"
  #          quality  structure  construction  green
  matrix:
    - [1,     1/2,   1/4,   1]      # quality
    - [2,     1,     1/3,   2]      # structure
    - [4,     3,     1,     4]      # construction
    - [1,     1/2,   1/4,   1]      # green

resident:
  name: 住户
  note: >-
    住得好最重要（采光、通风、户型、电梯），结构安全是不可让的底线，
    绿色低碳能省物业费所以有一定分量，施工过程与自己关系最小。
  source: "【示例】TODO(专业组)：占位矩阵，一致性合格但数值待核定"
  #          quality  structure  construction  green
  matrix:
    - [1,     2,     5,     3]      # quality
    - [1/2,   1,     3,     2]      # structure
    - [1/5,   1/3,   1,     1/2]    # construction
    - [1/3,   1/2,   2,     1]      # green
