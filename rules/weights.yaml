# ============================================================================
# 角色权重模板（AHP 两两比较矩阵）
# ============================================================================
#
# 这个文件**不是规则列表**，check_rules 会用另一套检查处理它。
# 它回答的问题是：「站在不同人的立场上，四个维度谁更重要？」
#
# 前端的「按角色排序」下拉框就是读这四个模板；用户也可以拖滑杆自己给权重，
# 那条路不经过这个文件。
#
# ----------------------------------------------------------------------------
# 这四条矩阵是怎么定的
# ----------------------------------------------------------------------------
# 四个维度的顺序**固定**为：
#
#        quality（居住品质）  structure（结构安全）
#        construction（施工友好）  green（绿色低碳）
#
# 依据两条：
#   1. 大赛主题「为人民建好房，为工友谋幸福」——居住品质对应「好房」，
#      施工友好对应「工友幸福」，两者都是主题的正面考核项，不能被压到最低；
#   2. 四类主体各自的决策目标（政府看强制要求与双碳、企业看成本与售价、
#      总包看工期与周转、住户看居住体验与长期支出）。
#
# ⚠️ 这四条矩阵属于**组内经验判断，不是规范条文**：规范只规定下限（例如
#    《住宅项目规范》GB 55038—2025 的层高、电梯等强制要求），不会规定某个
#    角色认为哪个维度更重要。因此 source 一律按「经验规则（专业组）」格式写。
#    数值如需再调，改完务必跑一遍：
#
#        uv run --project backend python scripts/check_rules.py
#
# ----------------------------------------------------------------------------
# 怎么读、怎么改
# ----------------------------------------------------------------------------
# 矩阵是 4×4，第 i 行第 j 列的值表示「第 i 个维度比第 j 个维度重要多少倍」：
#
#        1    两者一样重要
#        3    第 i 个稍微更重要
#        5    第 i 个明显更重要
#        7    第 i 个强烈更重要
#        9    第 i 个极端更重要
#        2 4 6 8    上面几档之间的折中
#        1/3 1/5 …  反过来，第 j 个更重要
#
# 三条硬性要求（写错 check_rules 会报错并告你怎么改）：
#
#   1. 对角线必须全是 1（自己和自己一样重要）；
#   2. 必须互反：如果 a[i][j] 写了 3，那么 a[j][i] 必须写 1/3；
#   3. 判断不能自相矛盾得太厉害。引擎会算一个「一致性比率 CR」，
#      **CR 必须小于 0.1**。
#
# 分数直接写成 `1/3` 这种形式即可（不要写 0.33，四舍五入会破坏上面的互反检查）。
#
# ----------------------------------------------------------------------------
# 也可以跳过矩阵直接给权重
# ----------------------------------------------------------------------------
# 如果某个角色的权重是上级直接规定的（不是你们推出来的），可以用 weights 代替
# matrix，四个数按上面的维度顺序写，引擎会自动归一化：
#
#     some_role:
#       name: 某个角色
#       weights: [0.4, 0.2, 0.3, 0.1]
#       source: "XX 文件规定"
#
# 这种写法没有一致性检验可做（没有矩阵），CR 会记为空。
# ============================================================================

government:
  name: 政府 / 保障房平台
  note: >-
    居住品质与绿色低碳并列最高：前者对应「好房子」的强制要求（层高、净高、
    电梯设置等由《住宅项目规范》GB 55038—2025 全文强制约束），后者对应双碳
    考核。结构安全是底线，施工友好对应大赛主题的「为工友谋幸福」，
    二者并列次之——原模板把施工友好压到最低，与主题不符，故已上调。
  source: "经验规则（专业组）：按大赛主题与政府考核目标赋权，本矩阵完全一致（CR≈0），非规范条文"
  #          quality  structure  construction  green
  matrix:
    - [1,     2,     2,     1]      # quality
    - [1/2,   1,     1,     1/2]    # structure
    - [1/2,   1,     1,     1/2]    # construction
    - [1,     2,     2,     1]      # green

developer:
  name: 开发企业
  note: >-
    居住品质是销售卖点，施工友好直接决定工期与建造成本，两者接近且最高；
    结构安全按规范做到即可，不构成竞争点；绿色低碳在没有强制指标时
    投入意愿最低。
  source: "经验规则（专业组）：按开发企业成本—售价—工期目标赋权，非规范条文"
  #          quality  structure  construction  green
  matrix:
    - [1,     3,     1,     4]      # quality
    - [1/3,   1,     1/3,   2]      # structure
    - [1,     3,     1,     3]      # construction
    - [1/4,   1/2,   1/3,   1]      # green

contractor:
  name: 施工总包
  note: >-
    施工友好压倒性重要（标准化程度直接决定工期、模板周转与工友安全），
    结构安全次之（风险特征越少越好施工），居住品质与绿色低碳不由总包决定。
  source: "经验规则（专业组）：按施工工期、周转材料与作业安全目标赋权，非规范条文"
  #          quality  structure  construction  green
  matrix:
    - [1,     1/2,   1/4,   1]      # quality
    - [2,     1,     1/3,   2]      # structure
    - [4,     3,     1,     4]      # construction
    - [1,     1/2,   1/4,   1]      # green

resident:
  name: 住户
  note: >-
    住得好最重要（采光、通风、户型、电梯），结构安全是不可让的底线，
    绿色低碳关系到长期能耗与物业支出，施工过程与住户关系最小。
  source: "经验规则（专业组）：按住户居住体验与长期使用成本赋权，非规范条文"
  #          quality  structure  construction  green
  matrix:
    - [1,     2,     5,     3]      # quality
    - [1/2,   1,     3,     2]      # structure
    - [1/5,   1/3,   1,     1/2]    # construction
    - [1/3,   1/2,   2,     1]      # green
