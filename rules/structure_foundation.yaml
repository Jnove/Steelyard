# 地基基础规则。规则 ID 用 S-XX（前缀按维度选，文件按主题分）。
#
# 依据：**GB 55003—2021《建筑与市政地基基础通用规范》**（全文强制，国家层面标准）。
# 本文件的条号与数值均由**原文逐字核对**得到（中国建筑科学研究院规范库页面），
# 不是二手转录，可直接对照条文。
#
# 为什么值得单独一类：基础做法（筏基 / 桩筏 / 桩基…）会直接改变材料要求与造价，
# 而它在上部结构相同的情况下是可以横向比较的——属于方案比选里应当显式比较的维度。
#
# 本系统暂不判定的地基基础条目（缺字段或属设计输出），列出备查：
# 第2.1.4条第2款基坑工作年限已由 K-08 校核。
# · 第2.1.4条第3款 边坡工程工作年限——本项目不涉及边坡；
# · 第6.1.3条 抗浮稳定性、第2.2.4条第5款 抗浮设计属必做内容——需要"抗浮设防水位"等
#   水文地质输入，且是否满足抗浮要靠验算，不是方案层能判的；
# 第6.3.5条贯通筋配筋率已由 S-25 校核，保护层要求尚未覆盖。
# 第7.2.6条内支撑等级与第7.2.8条锚杆自由段已由 K-09 / K-10 校核。
# · 第4.2.6条 地基变形、第5.2.10条 桩基沉降——规范只给"不应大于允许值"，
#   全篇没有数值限值，属设计输出。

- id: S-17
  name: 筏形 / 桩筏基础混凝土强度等级下限
  type: hard
  # 只对规范给了下限的两种形式判定；其余基础形式判为"不适用"，不硬套 C30。
  when: "foundation_type == '筏形基础' or foundation_type == '桩筏基础'"
  check: "foundation_concrete_grade >= 30"
  message: "筏形 / 桩筏基础的混凝土强度等级 C{foundation_concrete_grade} 低于 GB 55003 要求的 C30"
  source: "GB 55003—2021《建筑与市政地基基础通用规范》第6.3.5条：筏形基础、桩筏基础的混凝土强度等级不应低于C30；筏形基础、桩筏基础底板上下贯通钢筋的配筋率不应小于0.15%；……（原文逐字核对）。本条按基础专用混凝土强度等级字段判定；未填写时为数据不足，不用上部结构等级替代"

- id: S-18
  name: 地基与基础设计工作年限不低于上部结构
  type: hard
  # 不写 when：两个年限字段任一缺失时，引擎会判为「数据不足」，
  # 不会误判为通过——这正是我们想要的语义。
  check: "foundation_working_life >= design_working_life"
  message: "地基与基础的设计工作年限 {foundation_working_life} 年低于上部结构的 {design_working_life} 年"
  source: "GB 55003—2021 第2.1.4条第1款：地基与基础的设计工作年限不应低于上部结构的设计工作年限。同条第2款基坑工作年限要求另由 K-08 判定"
