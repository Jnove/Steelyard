# MiC（混凝土模块化建筑）专项规则。规则 ID 用 S-XX（前缀按维度选，文件按主题分）。
#
# 依据：**浙江省《混凝土模块化建筑技术导则》（浙建管发〔2026〕118号，2026-09-10 印发）**。
# 这份导则是省住建厅公开文件，本文件的数值均由**官方 PDF 正文逐行核对**得到
# （不是二手转录），条号与表号可直接对照原文。
#
# 为什么单独一个文件：混凝土体系的规则在 structure.yaml，模块化建筑另有成体系的
# 材料、高宽比、单元尺寸与连接要求；分成主题文件便于专业组按主题查找，
# 也便于日后按需替换某一册依据。**前缀仍按维度用 S**，不按文件选。

- id: S-15
  name: MiC 混凝土强度等级下限
  type: hard
  when: "structure_type == 'MiC'"
  check: "concrete_grade >= 30"
  message: "模块化建筑的混凝土强度等级 C{concrete_grade} 低于导则要求的 C30"
  source: "浙江省《混凝土模块化建筑技术导则》（浙建管发〔2026〕118号）第4.1.2条：模块化建筑的混凝土强度等级不应低于 C30。注意与 S-14 的区别：S-14 是国标对钢筋混凝土结构的通用下限（C25），本条是模块化建筑的更高要求，用词同为「不应低于」"

- id: S-16
  name: MiC 最大高宽比（提示）
  type: hard
  # 导则第6.1.10条用词是「宜」：宜符合表6.1.10 的规定。故本条只作提示。
  # 表6.1.10 的 6 度列与 7 度列数值相同，所以不必按烈度分支。
  when: "structure_type == 'MiC'"
  check: "height_width_ratio <= (4 if mic_system == '模块化框架结构' else (4 if mic_system == '模块化箱模框架结构' else 6))"
  message: "高宽比 {height_width_ratio} 超过导则表6.1.10 对该 MiC 体系的最大值（框架类 4、剪力墙与框架-剪力墙类 6）"
  severity: warning
  source: "浙江省《混凝土模块化建筑技术导则》第6.1.10条 表6.1.10「模块化结构适用的最大高宽比」：模块化框架结构 4、模块化全预制剪力墙结构 6、模块化叠合剪力墙结构 6、模块化箱模框架结构 4、模块化箱模框架-剪力墙结构 6、模块化箱模剪力墙结构 6（6 度与 7 度列相同，数值已按官方 PDF 正文逐行核对）。条文用词为「宜」，故本条只作提示"
