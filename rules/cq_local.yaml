# 重庆册（pack: CQ）
#
# **依据文件**：《好房子技术导则（保障性住房）》渝建勘设〔2025〕41号
#   发布：重庆市住房和城乡建设委员会，2025 年 12 月。
#   正文来源：重庆市住建委官网 PDF
#   （zfcxjw.cq.gov.cn/zwxx_166/gsgg/202512/P020251211404039893482.pdf，46 页），
#   **去空格逐字核对日期：2026-10-13**。
#
# 这份导则的对象正好是**保障性住房**，与本项目的样例类型一致。
# 市级文件（如《住宅设计标准》DBJ50/T-501-2024 及各区分区要求）另案处理。

- id: CQ-Q-01
  pack: CQ
  name: 重庆保障性住房层高下限
  type: hard
  check: "floor_height >= 3.0"
  message: "保障性住房层高 {floor_height} m 低于重庆市导则要求的 3.0 m"
  source: "《好房子技术导则（保障性住房）》（渝建勘设〔2025〕41号，重庆市住房和城乡建设委员会 2025 年 12 月）第5.3.3节「套内空间」第4款：保障性住房的层高不应低于3.0m（官方 PDF 去空格逐字核对，2026-10-13）"

- id: CQ-Q-02
  pack: CQ
  name: 重庆保障性住房窗地面积比下限
  type: hard
  # 严于国标（国标为 1/6）：重庆保障房导则要求 1/7。
  check: "window_floor_ratio >= 1/7"
  message: "窗地面积比 {window_floor_ratio} 低于重庆市导则要求的 1/7（严于国标 1/6）"
  source: "同上 第5.4.2节「光环境」第2款：住宅的起居室、卧室应进行采光计算，卧室、书房、起居室等房间的窗地面积比不应小于1/7（官方 PDF 去空格逐字核对，2026-10-13）"

- id: CQ-Q-03
  pack: CQ
  name: 重庆保障性住房梯户配比（提示）
  type: hard
  severity: warning
  # 户/台 = 总户数 ÷ 电梯总台数。60 户/台为该导则给的区间上限，超过才提示。
  check: "units / total_elevators <= 60"
  message: "每台电梯服务 {units} / {total_elevators} 户，超过重庆市导则建议的 30~60 户/台 区间上限"
  source: "同上 第5.3.2节「梯户配比」第1款：电梯数量及规格应根据楼层高度和住户数量合理配置，宜按 30~60 户/台配置，并符合重庆市工程建设标准《住宅电梯配置和选型及安装维护标准》DBJ 50-253 的相关规定（官方 PDF 去空格逐字核对，2026-10-13）。条文用词为「宜」，故本条只作提示"
