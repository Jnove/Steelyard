<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>筑衡 · 产品流程原型</title>
  <style>
    :root{font-family:Inter,"Microsoft YaHei",sans-serif;color:#17243b;background:#f4f6fa;--blue:#315cba;--line:#dce3ef;--muted:#66758f}
    *{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}
    .shell{display:grid;grid-template-columns:220px 1fr;min-height:100vh}.side{background:#fff;border-right:1px solid var(--line);padding:26px 18px}.brand{font-size:23px;font-weight:800;margin-bottom:4px}.brand small{font-size:12px;color:var(--muted);font-weight:400;display:block;margin-top:5px}.side nav{margin-top:42px;display:grid;gap:8px}.nav{background:transparent;border:0;text-align:left;padding:12px 14px;border-radius:8px;color:#53637e}.nav.active{background:#e9effb;color:var(--blue);font-weight:700}.main{padding:22px min(4vw,54px) 60px;max-width:1550px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;gap:20px;align-items:center;color:var(--muted);font-size:13px}.tag{padding:6px 10px;background:#fff5dc;color:#805a00;border-radius:6px}.hero{margin:28px 0 23px}.eyebrow{color:var(--blue);font-size:12px;font-weight:700;letter-spacing:.12em}.hero h1{font-size:30px;margin:8px 0}.hero p{margin:0;color:var(--muted);line-height:1.7}.steps{display:flex;flex-wrap:wrap;gap:8px;margin:25px 0}.step{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 14px;color:#586984}.step.active{background:var(--blue);border-color:var(--blue);color:#fff}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:18px}.card{grid-column:span 12;background:#fff;border:1px solid var(--line);border-radius:12px;padding:23px;box-shadow:0 4px 16px #1d315508}.half{grid-column:span 6}.third{grid-column:span 4}.two{grid-column:span 8}h2{font-size:19px;margin:0 0 18px}h3{font-size:15px;margin:0 0 12px}.muted{color:var(--muted)}.small{font-size:12px}.lead{font-size:24px;font-weight:750;margin:8px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:12px 0;border-bottom:1px solid #edf0f5}.row:last-child{border:0}.pill{font-size:12px;border-radius:5px;padding:4px 8px;background:#edf5ee;color:#237346}.bad{background:#fff0ef;color:#b43e37}.warn{background:#fff7e8;color:#995d0a}.btn{border:1px solid var(--blue);background:var(--blue);color:white;padding:10px 17px;border-radius:7px}.btn.secondary{background:white;color:var(--blue)}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.alert{border-left:4px solid #ca4843;background:#fff2f1;padding:16px;margin:12px 0;border-radius:5px;line-height:1.7}.info{border-left:4px solid var(--blue);background:#edf3ff;padding:15px;margin:12px 0;border-radius:5px;line-height:1.7}.field{display:grid;gap:7px;margin:12px 0}.field label{font-size:13px;font-weight:700}.field input{width:100%;max-width:340px;border:1px solid #bdc9db;border-radius:6px;padding:10px}.bar{height:9px;border-radius:10px;background:#e8edf6;overflow:hidden}.bar i{display:block;height:100%;background:var(--blue)}.metric{display:grid;grid-template-columns:110px 1fr 44px;align-items:center;gap:12px;margin:12px 0;font-size:13px}.comparison{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.score{background:#f3f6fb;padding:14px;border-radius:7px;font-size:12px}.score strong{display:block;font-size:22px;margin-top:5px}.status{display:flex;gap:10px;align-items:center;margin-bottom:10px}.report{line-height:1.85}.report section{padding:12px 0;border-bottom:1px solid var(--line)}.report section:last-child{border:0}.footer{color:var(--muted);font-size:12px;margin-top:22px}.hidden{display:none}.wire{border:1px dashed #aebcd3;border-radius:7px;padding:12px;color:#64758f;background:#fafcff}.slider{width:100%;accent-color:var(--blue)}
    @media(max-width:800px){.shell{display:block}.side{padding:15px;border-right:0;border-bottom:1px solid var(--line)}.side nav{display:none}.main{padding:20px}.half,.third,.two{grid-column:span 12}.comparison{grid-template-columns:repeat(2,1fr)}}
  </style>
</head>
<body>
<div class="shell">
  <aside class="side"><div class="brand">衡 · 筑衡<small>建筑方案智能比选</small></div><nav id="sideNav"></nav></aside>
  <main class="main">
    <div class="top"><span>杭州钱塘 · 保障性租赁住房 / 演示项目</span><span class="tag">示例数据 · 仅用于流程设计</span></div>
    <header class="hero"><div class="eyebrow">PRODUCT FLOW / 低保真交互原型</div><h1 id="title"></h1><p id="subtitle"></p></header>
    <div class="steps" id="steps"></div><div class="grid" id="content"></div>
    <div class="footer">本原型用于讨论信息层级和操作流程；分数、阈值、规范依据均为仓库中的开发示例，不代表工程结论。</div>
  </main>
</div>
<script>
const names=['方案录入','合规检查','多方案比选','角色与权重','What-if 推演','最终报告'];
const desc=[
 '先交代共同地块条件，再逐个填写候选方案；缺项和单位在录入时提示。',
 '先处理会影响决策的硬约束。违规方案清楚说明原因，并从默认排名中分离。',
 '先给出一句可理解的比较结论，再展示排名、四维差异和可追溯依据。',
 '让用户知道当前从谁的角度判断，以及改变权重后究竟发生了什么。',
 '只修改一个参数，保留原方案，直接比较修改前后结果。',
 '将结论、合规问题、取舍、稳健性和建议组织成可读报告。'];
let page=0,role='政府',weight=36,repeat=85;
const card=(title,body,cls='')=>`<article class="card ${cls}"><h2>${title}</h2>${body}</article>`;
const btn=(label,n,secondary=false)=>`<button class="btn ${secondary?'secondary':''}" onclick="go(${n})">${label}</button>`;
function go(n){page=n;render();window.scrollTo({top:0,behavior:'smooth'})}
function render(){document.getElementById('title').textContent=names[page];document.getElementById('subtitle').textContent=desc[page];document.getElementById('steps').innerHTML=names.map((n,i)=>`<button class="step ${i===page?'active':''}" onclick="go(${i})">${i+1} ${n}</button>`).join('');document.getElementById('sideNav').innerHTML=names.map((n,i)=>`<button class="nav ${i===page?'active':''}" onclick="go(${i})">0${i+1}　${n}</button>`).join('');document.getElementById('content').innerHTML=pages[page]();}
const pages=[
()=>card('本次比选',`<div class="lead">同一地块，比较 5 套住宅方案</div><p class="muted">项目条件对所有方案相同；方案参数分别录入。建议首先确认项目条件，避免后面的违规提示失去语境。</p><div class="comparison"><div class="score">地块位置<strong>杭州钱塘</strong></div><div class="score">用地面积<strong>12,000㎡</strong></div><div class="score">候选方案<strong>5 套</strong></div><div class="score">当前状态<strong>待评估</strong></div></div>`, 'two')+card('方案 C · 参数录入',`<div class="field"><label>方案名称</label><input value="C MiC 高标准化"></div><div class="field"><label>层高（m）</label><input value="3.1"></div><div class="field"><label>标准层重复率（%）</label><input value="85"></div><div class="field"><label>结构体系</label><input value="MiC 模块化" disabled></div><p class="small muted">线框重点：字段分组、单位、必填说明、缺项提醒与 Excel 导入入口。完整字段以现有数据模式为准。</p><div class="actions">${btn('保存并进行合规检查 →',1)}</div>`,'third'),
()=>card('检查结论',`<div class="lead">5 套方案已检查 · 1 套未通过硬约束</div><p class="muted">合格方案进入默认排序。存在错误级违规的方案仍可查看详情，避免被“消失”。</p><div class="actions">${btn('查看合格方案比较 →',2)}</div>`,'two')+card('需要处理',`<div class="alert"><strong>B 不合规</strong><br>住宅层高 2.9 m，低于当前示例阈值 3.0 m。<br><span class="small">规则 C-01 · 错误级 · 默认不参与排名</span></div><div class="wire">这里预留：正式规范条文、条号、修改建议。当前 T10 尚未接入，不能显示成已核实的真实依据。</div>`,'third')+card('逐方案状态',`<div class="row"><span>A 高品质</span><span class="pill">通过</span></div><div class="row"><span>B 不合规</span><span class="pill bad">硬约束未通过</span></div><div class="row"><span>C MiC 高标准化</span><span class="pill">通过</span></div><div class="row"><span>D 均衡</span><span class="pill">通过</span></div><div class="row"><span>E 被支配</span><span class="pill">通过</span></div>`),
()=>card('先看结论',`<div class="lead">当前示例中，C MiC 高标准化排第一</div><p>它在施工友好和绿色低碳方面较强；A 的居住品质取向不同。排名是权重下的比较结果，需连同四维表现一起阅读。</p><div class="info">B 因硬约束未通过，默认不参与下方排名。点击方案可查看原始值、评分函数和规则出处。</div><div class="actions">${btn('切换决策视角 →',3)}</div>`,'two')+card('排名',`<div class="row"><strong>01　C MiC 高标准化</strong><span>0.959</span></div><div class="row"><strong>02　D 均衡</strong><span>0.671</span></div><div class="row"><strong>03　E 被支配</strong><span>0.366</span></div><div class="row"><strong>04　A 高品质</strong><span>0.000</span></div><p class="small muted">数值为仓库示例，不表示绝对质量分。</p>`,'third')+card('四维表现 · 展开后比较',`<div class="metric"><span>居住品质</span><div class="bar"><i style="width:60%"></i></div><b>60</b></div><div class="metric"><span>结构安全</span><div class="bar"><i style="width:100%"></i></div><b>100</b></div><div class="metric"><span>施工友好</span><div class="bar"><i style="width:100%"></i></div><b>100</b></div><div class="metric"><span>绿色低碳</span><div class="bar"><i style="width:98%"></i></div><b>98</b></div><p class="small muted">图表建议：首屏用条形对照表现差异；雷达图作为辅助视图，避免五条线叠在一起难以辨认。</p>`),
()=>card('选择决策视角',`<div class="actions">${['政府','开发企业','施工总包','住户'].map(r=>`<button class="btn ${role===r?'':'secondary'}" onclick="role='${r}';render()">${r}</button>`).join('')}</div><div class="info">当前：${role}视角。现有示例中四个角色切换后名次相同，权重和贴近度会变化。视频不能把这一步剪成“角色切换即换位”。</div>`,'half')+card('调整居住品质权重',`<p>试着拖动滑杆，观察自定义权重带来的结果变化。</p><input class="slider" type="range" min="0" max="100" value="${weight}" oninput="weight=Number(this.value);document.getElementById('weightValue').textContent=weight+'%'" onchange="render()"><div class="lead" id="weightValue">${weight}%</div><p class="muted">其余维度按比例调整；正式数值由后端计算。</p>`,'half')+card('结果变化',`<div class="lead">${weight>=90?'E 被支配升至第一':'C MiC 高标准化仍为第一'}</div><p>${weight>=90?'这是仓库演示数据中自定义权重导致的名次换位。':'当前权重下，先观察方案贴近度和四维取舍。'}</p><div class="actions">${btn('尝试修改方案参数 →',4)}</div>`),
()=>card('建立一个推演副本',`<p>选择方案 C，修改“标准层重复率”。系统保存副本并重跑检查、评分和排序；原方案参数保留。</p><div class="field"><label>标准层重复率（%）</label><input type="number" min="0" max="100" value="${repeat}" oninput="repeat=Number(this.value)"></div><div class="actions"><button class="btn" onclick="document.getElementById('whatifResult').classList.remove('hidden')">查看推演结果</button></div>`,'half')+card('比较方式',`<div class="wire">原方案 C　→　推演副本 C′<br><br>输入变化 → 指标变化 → 四维得分变化 → 排名变化<br><br>每一步都可展开依据；不能只给一句“更好”。</div>`,'half')+card('推演结果示意',`<div id="whatifResult" class="hidden"><div class="info">已修改标准层重复率。正式原始值、分数和排名变化须由后端计算后显示；此线框不编造结果。</div><div class="actions">${btn('生成最终报告 →',5)}</div></div><p class="small muted">当前前端演示支持修改标准层重复率。策划书中的“改用 MiC”情节尚不适合直接按现有操作录制。</p>`),
()=>card('报告摘要',`<div class="report"><section><h3>01 结论</h3>在当前示例权重下，C MiC 高标准化排第一。正文应写明角色视角和候选方案范围。</section><section><h3>02 合规问题</h3>B 方案存在错误级硬约束未通过项，默认排除于排名之外。</section><section><h3>03 四维取舍</h3>按居住品质、结构安全、施工友好、绿色低碳逐项解释差异，并链接到指标原值与评分依据。</section><section><h3>04 稳健性与建议</h3>展示权重扰动结果、What-if 对比和下一步需核实的信息。</section></div><div class="actions"><button class="btn" onclick="alert('原型说明：正式系统当前支持 Markdown 报告下载；此处仅演示入口。')">导出报告</button>${btn('返回方案比较',2,true)}</div>`,'two')+card('可信度提示',`<div class="alert">当前规则阈值、权重和数据仍有示例内容。正式展示前应由专业组确认。</div><p class="small muted">报告中每个数字应可追溯到输入、公式、规则；未核实数字要明确标记。规范原文位置待 T10 接入。</p>`,'third')
];
render();
</script>
</body>
</html>
